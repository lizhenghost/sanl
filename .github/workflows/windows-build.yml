name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# 修复 "Resource not accessible by integration"：默认 GITHUB_TOKEN 无 release 写权限
permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file server (Sanl.exe)
        shell: pwsh
        run: |
          pyinstaller --onefile --name Sanl `
            --add-data "src;src" `
            --add-data "static;static" `
            --add-data "config;config" `
            --add-data "presets;presets" `
            --add-data "frontend;frontend" `
            main.py
          Compress-Archive -Path dist/Sanl.exe -DestinationPath dist/Sanl-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sanl-windows-exe
          path: dist/Sanl-windows.zip

      - name: Attach to release（打 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sanl-windows.zip

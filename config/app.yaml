app:
  api_key: sanl-8f4a2c91b7e6d305
  debug: false
  engine_workdir: ./output/engine
  host: 0.0.0.0
  name: Sanl
  port: 8899
  version: 2.6.2
database:
  path: ./data/nodes.db
scheduler:
  auto_clean_days: 7
  check_backend: subs-check
  check_cron: 0 7,14,18 * * *  # 北京时间每天 7:00/14:00/18:00
  check_mode: speed
  fetch_cron: 0 7,14,18 * * *  # 北京时间每天 7:00/14:00/18:00
  qualified_latency_ms: 800
sources:
  github:
    enabled: true
    proxies:
    - https://ghfast.top/
    refresh_interval: 3600
  static_json:
    enabled: true
    path: ./data/sources.json
  telegram:
    enabled: true
    refresh_interval: 7200
subs_check:
  binary_path: ./subs-check
  concurrent: 30
  config_path: ./config/subs-check.yaml
  listen_port: :8199
  min_speed: 256
  output_dir: ./output
  speed_concurrent: 10
  speed_test_url: https://github.com/AaronFeng753/Waifu2x-Extension-GUI/releases/download/v2.21.12/Waifu2x-Extension-GUI-v2.21.12-Portable.7z
  timeout: 8000

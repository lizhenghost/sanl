[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodepool"
version = "2.1.0"
description = "免费节点池聚合平台 — FastAPI + subs-check 引擎"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "NodePool Contributors" }]
keywords = ["proxy", "clash", "v2ray", "singbox", "subscription", "speedtest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: Proxy Servers",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
nodepool = "main:main"

[tool.setuptools]
packages = { find = { include = ["src*"] } }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sanl - 节点池聚合平台</title>
    <!-- PWA：安卓 Chrome/Edge 可「安装应用」到桌面，全屏独立运行 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" href="/static/icons/favicon.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sanl">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () =>
                navigator.serviceWorker.register('/sw.js').catch(err =>
                    console.warn('SW register failed:', err)));
        }
    </script>
    <script src="/vendor/echarts.min.js?v=5.4.3"></script>
    <script src="/vendor/qrcode.min.js?v=1.0.0" defer></script>
    <style>
        :root {
            --bg: #f0f4fa; --surface: #ffffff; --surface-2: #f8fafc;
            --border: #e2e8f0; --text: #1e293b; --text-muted: #64748b;
            --primary: #2563eb; --primary-hover: #1d4ed8; --accent: #0ea5e9;
            --success: #16a34a; --warning: #d97706; --danger: #dc2626;
            --shadow: 0 1px 3px rgba(30,64,175,.08), 0 4px 16px rgba(30,64,175,.07);
            --shadow-lg: 0 4px 8px rgba(30,64,175,.10), 0 12px 32px rgba(30,64,175,.12);
            --hover: #eff6ff; --code-bg: #f1f5f9;
        }
        [data-theme="dark"] {
            --bg: #0b1220; --surface: #151f31; --surface-2: #1c2a40;
            --border: #2a3a55; --text: #e2e8f0; --text-muted: #8fa3bd;
            --primary: #60a5fa; --primary-hover: #93c5fd; --accent: #38bdf8;
            --success: #34d399; --warning: #fbbf24; --danger: #f87171;
            --shadow: 0 1px 3px rgba(0,0,0,.35), 0 4px 16px rgba(0,0,0,.3);
            --shadow-lg: 0 4px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
            --hover: #1e2d47; --code-bg: #0f1a2c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: auto; }
        .container { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; flex-shrink: 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
        .main { flex: 1; padding: 30px; overflow-y: auto; min-width: 0; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--text-muted); font-size: 14px; font-weight: normal; }
        .nav-item { padding: 12px 16px; border-radius: 10px; cursor: pointer; transition: all .2s ease; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-weight: 500; }
        .nav-item:hover { background: var(--hover); color: var(--primary); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.30); }
        .sidebar-footer { margin-top: auto; padding-top: 20px; color: #94a3b8; font-size: 12px; }
        .nav-group { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: .8px; padding: 14px 16px 6px; font-weight: 700; }
        .nav-group:first-child { padding-top: 2px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--surface); padding: 24px; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .stat-value { font-size: 36px; font-weight: bold; color: var(--primary); }
        .stat-label { color: var(--text-muted); margin-top: 8px; }
        .table-container { background: var(--surface); border-radius: 14px; overflow-x: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .table-container table { min-width: 640px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: var(--surface-2); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: .4px; white-space: nowrap; }
        tbody tr { transition: background .15s ease; }
        tbody tr:hover { background: var(--hover); }
        tbody tr:last-child td { border-bottom: none; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; display: inline-block; }
        .badge-success { background: #dcfce7; color: var(--success); }
        .badge-warning { background: #fef3c7; color: var(--warning); }
        .badge-danger { background: #fee2e2; color: var(--danger); }
        .badge-info { background: #dbeafe; color: var(--primary); }
        .badge-secondary { background: #f1f5f9; color: var(--text-muted); }
        .btn { padding: 10px 20px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; font-size: 14px; transition: all .2s ease; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; text-decoration: none; }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.25); }
        .btn-primary:hover { box-shadow: 0 4px 16px rgba(37,99,235,.40); }
        .btn-secondary { background: var(--surface); color: var(--primary); border-color: var(--border); }
        .btn-secondary:hover { background: var(--hover); border-color: var(--primary); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-danger:hover { background: #fecaca; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: var(--text-muted); margin-bottom: 8px; font-size: 14px; }
        .form-input { width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; transition: border-color .2s, box-shadow .2s; }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        select.form-input { cursor: pointer; }
        textarea.form-input { min-height: 100px; font-family: monospace; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,.45); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--surface); border-radius: 18px; padding: 30px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: popIn .22s ease; }
        @keyframes popIn { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: bold; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .chart-container { background: var(--surface); border-radius: 14px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 20px; animation: fadeUp .3s ease both; }
        .chart { height: 300px; }
        .chart-tall { height: 500px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; animation: fadeUp .3s ease both; }
        .page-title { font-size: 28px; font-weight: bold; margin-bottom: 0; background: linear-gradient(120deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .table-container { animation: fadeUp .3s ease both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #dbeafe; border-radius: 50%; border-top-color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 12px; color: white; z-index: 2000; animation: slideIn .3s; box-shadow: var(--shadow-lg); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex-center { align-items: center; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .text-muted { color: var(--text-muted); }
        code { background: var(--hover); color: var(--primary); padding: 2px 8px; border-radius: 6px; font-size: 13px; }
        .token-display { background: var(--surface-2); border: 1px solid var(--border); padding: 12px; border-radius: 10px; font-family: monospace; font-size: 13px; word-break: break-all; user-select: all; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .preset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all .2s ease; box-shadow: var(--shadow); }
        .preset-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .preset-card.selected { border-color: var(--success); background: #f0fdf4; }
        .preset-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .preset-name { font-weight: 600; margin-bottom: 4px; }
        .preset-url { font-size: 11px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #bottom-tab { display: none; }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; padding: 10px 12px; display: flex; align-items: center; gap: 8px; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .sidebar .logo { white-space: nowrap; margin-bottom: 0; }
            .sidebar nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .sidebar nav::-webkit-scrollbar { display: none; }
            .nav-item { white-space: nowrap; font-size: 13px; padding: 8px 10px; }
            .sidebar-footer { display: none; }
            .nav-group { display: none; }
            .sidebar { display: none; }
            #bottom-tab { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
                background: var(--surface); border-top: 1px solid var(--border); padding: 6px 2px calc(6px + env(safe-area-inset-bottom)); }
            #bottom-tab > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
                font-size: 11px; color: var(--text-muted); cursor: pointer; padding: 4px 0; border-radius: 8px; }
            #bottom-tab > div.active { color: var(--primary); font-weight: 600; }
            .main { padding: 12px 12px 76px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .stat-card { padding: 16px; }
            .stat-value { font-size: 26px; }
            .grid-2 { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .page-title { font-size: 20px; }
            .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .table-container table { min-width: 560px; }
            .chart { height: 240px !important; }
            .flex { flex-wrap: wrap; gap: 8px; }
        }
        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .nav-item { font-size: 12px; padding: 7px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo" style="justify-content:space-between;">🌐 Sanl <span style="display:flex;gap:6px;align-items:center;">
                <button class="btn btn-sm btn-secondary" id="lang-btn" onclick="toggleLang()" title="Language" style="padding:4px 8px;font-size:12px;">EN</button>
                <button class="btn btn-sm btn-secondary" id="theme-btn" onclick="toggleTheme()" title="主题" style="padding:4px 8px;font-size:13px;">🌙</button>
              </span></div>
            <nav>
                <div class="nav-group">📊 总览</div>
                <div class="nav-item active" data-page="dashboard">📊 仪表盘</div>
                <div class="nav-group">🧩 节点池</div>
                <div class="nav-item" data-page="nodes">🔗 节点列表</div>
                <div class="nav-item" data-page="map">🌍 世界地图</div>
                <div class="nav-item" data-page="sources">📡 节点源</div>
                <div class="nav-item" data-page="subscribe">📥 订阅输出</div>
                <div class="nav-item" data-page="tokens">🔑 令牌管理</div>
                <div class="nav-item" data-page="check">⚡ 测速任务</div>
                <div class="nav-group">📖 文档</div>
                <a class="nav-item" href="/docs" target="_blank" style="text-decoration:none;color:inherit;">📚 API 文档</a>
                <div class="nav-group">🛰 CF 优选</div>
                <div class="nav-item" data-page="cfendpoints">🌐 优选端点</div>
                <div class="nav-item" data-page="cfscan">🔍 网段扫描</div>
                <div class="nav-group">🔁 转换工具</div>
                <div class="nav-item" data-page="convert">🔄 订阅转换</div>
                <div class="nav-item" data-page="cfworker">🚀 CF Worker</div>
            </nav>
            <div class="sidebar-footer">
                <div id="last-check">最近检查: --</div>
                <div id="total-nodes">总节点: 0</div>
            </div>
        </aside>
        <main class="main" id="main-content"></main>
    </div>
    <div id="toast-container"></div>
    <!-- 通用模态框 -->
    <div class="modal" id="modal-overlay">
        <div class="modal-content" id="modal-content"></div>
    </div>

    <script>
        const API = '/api';
        let currentPage = 'dashboard';
        let allNodes = [];

        // ===== 页面渲染 =====
        function showToast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentPage = item.dataset.page;
                renderPage(currentPage);
            });
        });


        function goPage(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));
            document.querySelectorAll('#bottom-tab > div').forEach(d => d.classList.toggle('active', d.dataset.page === page));
            renderPage(page);
        }
        function renderPage(page) {
            const main = document.getElementById('main-content');
            switch(page) {
                case 'dashboard': renderDashboard(main); break;
                case 'nodes': renderNodes(main); break;
                case 'map': renderMap(main); break;
                case 'sources': renderSources(main); break;
                case 'cfendpoints': renderCfEndpoints(main); break;
                case 'cfscan': renderCfScan(main); break;
                case 'check': renderCheck(main); break;
                case 'convert': renderConvert(main); break;
                case 'cfworker': renderCfWorker(main); break;
                case 'subscribe': renderSubscribe(main); break;
                case 'tokens': renderTokens(main); break;
            }
        }

        // ===== 仪表盘 =====
        function renderDashboard(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">📊 仪表盘</h1>
                    <div class="flex">
                        <button class="btn btn-secondary" onclick="loadDashboard()">🔄 刷新</button>
                        <button class="btn btn-primary" onclick="runCheck()">⚡ 立即测速</button>
                    </div>
                </div>
                <div class="stats-grid" id="dash-stats"></div>
                <div class="grid-2">
                    <div class="chart-container"><h3 style="margin-bottom:12px;">国家分布</h3><div id="chart-country" class="chart"></div></div>
                    <div class="chart-container"><h3 style="margin-bottom:12px;">协议分布</h3><div id="chart-type" class="chart"></div></div>
                </div>
                <div class="chart-container"><h3 style="margin-bottom:12px;">延迟分布</h3><div id="chart-latency" class="chart" style="height:200px;"></div></div>
                <div class="chart-container"><h3 style="margin-bottom:12px;">📈 测速历史趋势</h3><div id="chart-trend" class="chart" style="height:240px;"></div></div>
            `;
            loadDashboard();
        }

        async function loadDashboard() {
            try {
                const [statsRes, nodesRes, sourcesRes, rankRes] = await Promise.all([
                    fetch(`${API}/nodes/stats`), fetch(`${API}/nodes?limit=100`),
                    fetch(`${API}/sources`), fetch(`${API}/ranking?limit=5`)
                ]);
                const stats = await statsRes.json();
                const nodes = await nodesRes.json();
                const sources = await sourcesRes.json();
                const rank = await rankRes.json();
                allNodes = nodes;

                if (!document.getElementById('dash-stats')) return;  // 用户已切走页面，放弃本次渲染

                const active = stats.active || 0, total = stats.total || 0;
                document.getElementById('total-nodes').textContent = `总节点: ${total}`;
                document.getElementById('dash-stats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">总节点数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#16a34a;">${active}</div><div class="stat-label">可用节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#d97706;">${sources.length}</div><div class="stat-label">数据源数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#2563eb;">${rank.stats?.avg_score || 0}</div><div class="stat-label">平均评分</div></div>
                `;

                const activeNodes = nodes.filter(n => n.status === 'active');
                drawPieChart('chart-country', Object.entries(stats.countries || {}).map(([k,v]) => ({name:k,value:v})));
                const types = {}; nodes.forEach(n => { types[n.node_type] = (types[n.node_type]||0)+1; });
                drawPieChart('chart-type', Object.entries(types).map(([k,v]) => ({name:k.toUpperCase(),value:v})));
                const ranges = {'0-100ms':0,'100-200ms':0,'200-500ms':0,'500ms+':0};
                activeNodes.forEach(n => { if(n.latency<100) ranges['0-100ms']++; else if(n.latency<200) ranges['100-200ms']++; else if(n.latency<500) ranges['200-500ms']++; else ranges['500ms+']++; });
                drawBarChart('chart-latency', Object.keys(ranges), Object.values(ranges));
                // 历史趋势
                try {
                    const trend = await (await fetch(`${API}/stats/trend?limit=30`)).json();
                    drawTrendChart('chart-trend', trend);
                } catch(e) { console.warn('trend load failed', e); }
            } catch(e) { console.error('Dashboard error:', e); }
        }

        function drawTrendChart(id, trend) {
            const el = document.getElementById(id);
            if (!el) return;
            const chart = echarts.init(el);
            if (!trend || !trend.length) {
                el.innerHTML = '<div class="empty">暂无测速历史，跑一次测速后生成趋势</div>';
                return;
            }
            const times = trend.map(t => t.time ? new Date(t.time*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-');
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['存活节点','总节点'], textStyle: { color: '#64748b' } },
                grid: { left: 40, right: 16, bottom: 24, top: 36 },
                xAxis: { type: 'category', data: times, axisLabel: { color: '#64748b', fontSize: 10 } },
                yAxis: { type: 'value', axisLabel: { color: '#64748b' }, splitLine: { lineStyle: { color: '#e2e8f0' } } },
                series: [
                    { name: '存活节点', type: 'line', smooth: true, data: trend.map(t=>t.alive), itemStyle: { color: '#16a34a' }, areaStyle: { opacity: 0.12 } },
                    { name: '总节点', type: 'line', smooth: true, data: trend.map(t=>t.total), itemStyle: { color: '#2563eb' } }
                ]
            });
        }

        function drawPieChart(id, data) {
            const _el = document.getElementById(id);
            if (!_el) return;  // 页面已切换，放弃渲染（修复跨页 null 崩溃）
            const chart = echarts.init(_el);
            chart.setOption({ tooltip:{trigger:'item'}, series:[{type:'pie',radius:['40%','70%'],data,label:{show:true,formatter:'{b}: {c}'}}] });
        }
        function drawBarChart(id, x, y) {
            const _el = document.getElementById(id);
            if (!_el) return;  // 页面已切换，放弃渲染
            const chart = echarts.init(_el);
            chart.setOption({ tooltip:{trigger:'axis'}, xAxis:{type:'category',data:x}, yAxis:{type:'value'}, series:[{data:y,type:'bar',itemStyle:{color:'#2563eb'}}] });
        }

        // ===== 节点列表 =====
        function renderNodes(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">🔗 节点列表</h1>
                    <div class="flex">
                        <select class="form-input" style="width:120px;" id="nf-status" onchange="loadNodes()">
                            <option value="">全部状态</option>
                            <option value="active">可用</option>
                            <option value="inactive">不可用</option>
                        </select>

                            <input type="checkbox" id="nf-export-latency" checked> 延迟

            `;
            loadNodes();
        }

        let nodePage = 0, nodePageSize = 50, nodeTotal = 0;

        async function loadNodes(reset = true) {
            if (reset) nodePage = 0;
            const status = document.getElementById('nf-status').value;
            const type = document.getElementById('nf-type').value;
            const sort = document.getElementById('nf-sort') ? document.getElementById('nf-sort').value : 'latency';
            const order = document.getElementById('nf-order') ? document.getElementById('nf-order').value : 'asc';
            const src = document.getElementById('nf-src') ? document.getElementById('nf-src').value : '';
            const offset = nodePage * nodePageSize;
            // 真分页：每次只拉当前页（原写死 limit=200 导致永远只显示前 4 页）
            let url = `${API}/nodes?limit=${nodePageSize}&offset=${offset}&sort=${sort}&order=${order}&_t=${Date.now()}`;
            if (status) url += `&status=${status}`;
            if (type) url += `&node_type=${type}`;
            if (src) url += `&source_type=${src}`;
            try {
                const nodes = await (await fetch(url)).json();
                allNodes = nodes;
                // 总数用于计算总页数（来自统计接口）
                try {
                    const st = await (await fetch(`${API}/nodes/stats`)).json();
                    nodeTotal = (st && (st.total || st.total_nodes)) || nodes.length;
                } catch(e) { nodeTotal = nodes.length + offset; }
                const loading = document.getElementById('nodes-loading');
                if (loading) loading.style.display = 'none';
                renderNodePage();
            } catch(e) { console.error(e); }
        }

        function filterNodes() {
            const q = (document.getElementById('nf-search').value || '').toLowerCase();
            if (!q) { renderNodePage(); return; }
            const filtered = allNodes.filter(n => (n.node_name||'').toLowerCase().includes(q) || (n.country||'').includes(q));
            renderNodeTable(filtered);
            const _pg = document.getElementById('nodes-pagination');
            if (_pg) _pg.innerHTML = '';
        }

        function renderNodePage() {
            const pag = document.getElementById('nodes-pagination');
            if (!pag) return;  // 页面已切换，放弃渲染
            renderNodeTable(allNodes);  // allNodes 已是当前页数据
            const total = Math.max(1, Math.ceil(nodeTotal / nodePageSize));
            let html = '';
            if (nodePage > 0) html += `<button class="btn btn-sm btn-secondary" onclick="nodePage--;loadNodes(false)">上一页</button>`;
            html += `<span class="text-muted" style="padding:0 12px;">${nodePage+1}/${total}（共 ${nodeTotal} 节点）</span>`;
            if (nodePage < total - 1) html += `<button class="btn btn-sm btn-secondary" onclick="nodePage++;loadNodes(false)">下一页</button>`;
            pag.innerHTML = html;
        }

        let colVis = JSON.parse(localStorage.getItem('np_colvis') || '[]');
        function saveColVis() {
            const sel = document.getElementById('nf-cols');
            colVis = Array.from(sel.selectedOptions).map(o => o.value);
            localStorage.setItem('np_colvis', JSON.stringify(colVis));
            renderNodePage();
        }
        function starIcon(n) { return n.favorite ? '\u2B50' : '\u2606'; }

        async function toggleFavorite(id) {
            try {
                const r = await (await fetch(`${API}/nodes/${id}/favorite`, { method:'POST' })).json();
                if (r.status === 'ok') { showToast(r.favorite ? '\u2B50 已收藏，订阅输出置顶' : '已取消收藏'); loadNodes(); }
            } catch(e) { showToast('操作失败','error'); }
        }

        async function showTrend(nodeId, name) {
            try {
                const d = await (await fetch(`${API}/nodes/${nodeId}/history?days=7`)).json();
                const pts = d.points || [];
                const modal = document.createElement('div');
                modal.className = 'modal'; modal.style.display='flex';
                modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
                const times = pts.map(p => new Date((p.checked_at||0)*1000).toLocaleString());
                const lat = pts.map(p => p.latency);
                const spd = pts.map(p => p.download_speed ? +(p.download_speed/1048576).toFixed(2) : null);
                modal.innerHTML = `<div class="modal-content" style="max-width:760px;">
                    <h3 style="margin-bottom:14px;">\uD83D\uDCC8 近7天健康趋势 — ${(name||nodeId).toString().slice(0,40)}</h3>
                    ${pts.length ? '<div id="trend-chart" style="width:100%;height:320px;"></div>'
                      : '<p class="text-muted">该节点还没有测速历史（等下一轮测速后生成）</p>'}
                    <div class="flex" style="justify-content:flex-end;margin-top:16px;">
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">关闭</button></div></div>`;
                document.body.appendChild(modal);
                if (pts.length && window.echarts) {
                    const ch = echarts.init(document.getElementById('trend-chart'));
                    ch.setOption({ tooltip:{trigger:'axis'}, legend:{data:['延迟(ms)','速度(MB/s)']},
                        grid:{left:50,right:20,top:36,bottom:56},
                        xAxis:{type:'category', data:times},
                        yAxis:[{type:'value',name:'ms'},{type:'value',name:'MB/s'}],
                        series:[
                            {name:'延迟(ms)', type:'line', data:lat, smooth:true,
                             lineStyle:{color:'#2563eb'}, itemStyle:{color:'#2563eb'}},
                            {name:'速度(MB/s)', type:'line', yAxisIndex:1, data:spd, smooth:true,
                             lineStyle:{color:'#16a34a'}, itemStyle:{color:'#16a34a'}}
                        ]});
                }
            } catch(e) { showToast('加载趋势失败','error'); }
        }

        // ===== CSV / JSON 导出（优化 #5a）=====
        function exportNodes(fmt) {
            const rows = allNodes || [];
            if (!rows.length) { showToast('没有可导出的节点','error'); return; }
            const lc = document.getElementById('nf-export-latency');
            const withLat = !(lc && !lc.checked);
            let blob, fname;
            if (fmt === 'csv') {
                const head = ['name','type','country'].concat(withLat?['latency_ms']:[]).concat(['speed_Bps','score','status']);
                const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
                const lines = [head.join(',')].concat(rows.map(n => [n.node_name,n.node_type,n.country].concat(withLat?[n.latency]:[]).concat([n.download_speed,(n.score||0).toFixed(1),n.status]).map(esc).join(',')));
                blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
                fname = `nodes_${Date.now()}.csv`;
            } else {
                const mapper = n => Object.assign({name:n.node_name,type:n.node_type,country:n.country}, withLat?{latency:n.latency}:{}, {speed:n.download_speed,score:n.score,status:n.status});
                blob = new Blob([JSON.stringify(rows.map(mapper), null, 2)], {type:'application/json'});
                fname = `nodes_${Date.now()}.json`;
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = fname; a.click();
            URL.revokeObjectURL(a.href);
            showToast(`✅ 已导出 ${rows.length} 个节点 (${fmt.toUpperCase()})`);
        }

        // 国旗 emoji：由 ISO 国家/地区码（两位大写字母）换算，修复 Windows/部分安卓手机无法渲染国旗的问题
        function flagEmoji(code) {
            if (!code || code.length !== 2) return '';
            const A = 0x1F1E6, a = 'A'.charCodeAt(0);
            const c0 = code[0].toUpperCase().charCodeAt(0), c1 = code[1].toUpperCase().charCodeAt(0);
            if (c0 < a || c0 > a + 25 || c1 < a || c1 > a + 25) return '';
            try { return String.fromCodePoint(A + c0 - a, A + c1 - a); }
            catch(e) { return ''; }
        }
        function countryCell(n) {
            // 优先用干净的国家名；若带方框（别字/无法渲染）去掉，再补国旗 emoji
            const raw = (n.country || '');
            const code = (n.country_code || '').trim().toUpperCase();
            const flag = flagEmoji(code);
            const name = (raw || '').replace(/^[^\w\u4e00-\u9fa5]+/, '').replace(/\s+$/, '') || (code ? code : '🌐');
            if (!name) return '🌐';
            return flag ? `${flag} ${name}` : name;
        }

        function streamBadge(flags) {
            if (!flags) return '<span class="text-muted" style="font-size:12px;">-</span>';
            // 流媒体解锁徽章（Netflix/Disney/YouTube 等，来自 full 模式 media-check）
            const map = { 'Netflix':'NF','Disney':'D+','HBO':'HBO','Hulu':'Hulu','YouTube':'YT',
                          'ChatGPT':'GPT','TikTok':'TT','Prime':'PM' };
            return `<span class="badge badge-success" title="${flags}">${flags.split('|').map(f=>map[f]||f).join(' ')}</span>`;
        }

        async function banNode(id, ban) {
            try {
                const r = await (await fetch(`${API}/nodes/${id}/${ban ? 'ban' : 'unban'}`, { method: 'POST' })).json();
                if (r.status === 'ok') { showToast(ban ? '🚫 已封禁' : '♻️ 已解封（下轮测速重判）', 'success'); loadNodes(); }
                else showToast('操作失败', 'error');
            } catch(e) { showToast('❌ ' + e.message, 'error'); }
        }
        function renderNodeTable(nodes) {
            const tbody = document.getElementById('nodes-tbody');
            const thead = document.getElementById('nodes-thead-row');
            if (!tbody) return;
            const cols = [
                ['star','',''], ['name','名称'], ['type','协议'], ['country','国家'],
                ['latency','延迟'], ['speed','速度'], ['score','评分'], ['grade','等级'], ['status','状态'],
                ['stream','解锁',''], ['trend','📈',''], ['ban','🚫','']
            ].filter(c => !colVis.includes(c[0]));
            if (thead) thead.innerHTML = cols.map(c => `<th>${c[1]}</th>`).join('');
            if (!nodes.length) { tbody.innerHTML = `<tr><td colspan="${cols.length}" class="empty"><div class="empty-icon">📭</div>暂无节点</td></tr>`; return; }
            tbody.innerHTML = nodes.map(n => {
                const speed = n.download_speed ? (n.download_speed >= 1048576 ? (n.download_speed/1048576).toFixed(1)+'MB/s' : Math.round(n.download_speed/1024)+'KB/s') : '-';
                const score = n.score || 0;
                const scoreColor = score >= 50 ? '#22c55e' : score >= 20 ? '#f59e0b' : '#94a3b8';
                const statusClass = n.status === 'active' ? 'badge-success' : n.status === 'inactive' ? 'badge-danger' : 'badge-warning';
                const grade = n.grade ? `<span class="badge ${score>=70?'badge-success':score>=50?'badge-warning':'badge-danger'}">${n.emoji||''} ${n.grade}</span>` : '-';
                const safeName = String(n.node_name||'').replace(/'/g,'').slice(0,40);
                const cells = {
                    star: `<td style="cursor:pointer;font-size:16px;" onclick="toggleFavorite(${n.id})" title="收藏（订阅置顶）">${starIcon(n)}</td>`,
                    name: `<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;">${n.node_name||'-'}</td>`,
                    type: `<td><span class="badge badge-info">${(n.node_type||'').toUpperCase()}</span></td>`,
                    country: `<td>${countryCell(n)}</td>`,
                    latency: `<td>${n.latency ? n.latency+'ms' : '-'}</td>`,
                    speed: `<td>${speed}</td>`,
                    score: `<td style="color:${scoreColor};">${score.toFixed(1)}</td>`,
                    grade: `<td>${grade}</td>`,
                    status: `<td><span class="badge ${statusClass}">${n.status==='banned'?'🚫 '+n.status:n.status}</span></td>`,
                    stream: `<td>${streamBadge(n.stream_flags)}</td>`,
                    trend: `<td style="cursor:pointer;" onclick="showTrend(${n.id},'${safeName}')" title="近7天趋势">📈</td>`,
                    ban: `<td style="cursor:pointer;white-space:nowrap;" title="${n.status==='banned'?'解封':'封禁'}">${n.status==='banned'
                        ? `<button class="btn btn-secondary btn-sm" onclick="banNode(${n.id},false)">♻️ 解封</button>`
                        : `<button class="btn btn-secondary btn-sm" onclick="banNode(${n.id},true)">🚫 封禁</button>`}</td>`
                };
                return '<tr>' + cols.map(c => cells[c[0]]).join('') + '</tr>';
            }).join('');
        }

        // ===== 世界地图 =====
        let mapChart = null;
        let worldMapReady = null;  // 缓存 registerMap Promise，避免重复加载

        // 本地加载世界地图 GeoJSON 并注册到 ECharts（ECharts 5 不内置地图）
        function ensureWorldMap() {
            if (typeof echarts === 'undefined') {
                return Promise.reject(new Error('echarts 未加载'));
            }
            if (echarts.getMap && echarts.getMap('world')) return Promise.resolve(true);
            if (worldMapReady) return worldMapReady;
            worldMapReady = fetch('/vendor/world.json?v=1')
                .then(r => { if (!r.ok) throw new Error('world.json HTTP ' + r.status); return r.json(); })
                .then(geo => { echarts.registerMap('world', geo); return true; })
                .catch(e => { worldMapReady = null; throw e; });
            return worldMapReady;
        }

        function renderMap(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">🌍 世界地图</h1>
                    <div class="flex">
                        <button class="btn btn-secondary" onclick="loadMapData()">🔄 刷新</button>
                        <button class="btn btn-primary" onclick="refreshGeoIP()">🛰 识别出口位置</button>
                    </div>
                </div>
                <div id="map-stats" class="stats-grid" style="grid-template-columns:repeat(4,1fr);"></div>
                <div class="chart-container"><div id="chart-world" class="chart chart-tall"></div></div>
                <div class="chart-container"><h3 style="margin-bottom:12px;">各国节点数</h3><div id="chart-country-bar" class="chart" style="height:250px;"></div></div>
            `;
            loadMapData();
        }

        async function refreshGeoIP() {
            showToast('GeoIP 识别中（ip-api 免费接口，最多约 1 分钟）...');
            try {
                const res = await fetch(`${API}/geoip/refresh?limit=300`, { method: 'POST' });
                const data = await res.json();
                showToast(`GeoIP 完成：更新 ${data.updated}/${data.total} 个节点出口`);
                loadMapData();
            } catch(e) { showToast('GeoIP 刷新失败: ' + e.message, 'error'); }
        }

        async function loadMapData() {
            try {
                const [mapRes, statsRes] = await Promise.all([fetch(`${API}/map`), fetch(`${API}/nodes/stats`)]);
                const mapData = await mapRes.json();
                const stats = await statsRes.json();

                const countries = mapData.countries || [];
                if (!document.getElementById('map-stats')) return;  // 已离开地图页，放弃本次渲染
                const total = countries.reduce((s,c) => s+c.count, 0);
                document.getElementById('map-stats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${countries.length}</div><div class="stat-label">覆盖国家/地区</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#16a34a;">${total}</div><div class="stat-label">已定位节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#d97706;">${stats.active||0}</div><div class="stat-label">可用节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#2563eb;">${stats.total||0}</div><div class="stat-label">总节点</div></div>
                `;

                // 世界地图散点图（先确保本地 GeoJSON 注册成功，失败则降级为纯散点）
                if (mapChart) mapChart.dispose();
                mapChart = echarts.init(document.getElementById('chart-world'));
                const scatterData = mapData.scatter && mapData.scatter.length > 0 ? mapData.scatter :
                    countries.map(c => ({name: c.name, value: [c.lng, c.lat, c.count]}));

                let worldOk = false;
                try { worldOk = await ensureWorldMap(); } catch(e) { console.warn('世界地图底图加载失败:', e); }

                const mapOption = {
                    tooltip: { trigger: 'item', formatter: p => `${p.name}<br/>节点数: ${p.value[2]}` },
                    series: [{
                        type: 'scatter', coordinateSystem: worldOk ? 'geo' : 'cartesian2d',
                        data: scatterData.map(d => ({name: d.name, value: [d.value[0]||d.lng, d.value[1]||d.lat, d.value[2]||d.count]})),
                        symbolSize: v => Math.max(5, Math.min(30, v[2] * 3)),
                        itemStyle: { color: '#2563eb', opacity: 0.75 },
                        encode: { value: 2 },
                        // 世界地图上也显示国家名（节点数≥3 才显示，避免密集），原 worldOk 时完全隐藏导致地图标签太模糊
                        label: { show: true, formatter: p => (p.value && p.value[2] >= 3) ? p.name : '',
                                 position: 'right', color: '#475569', fontSize: 10 }
                    },
                    // 热门地区波纹动画（大纲 附录 I.2 effectScatter）：节点数 TOP 5
                    {
                        type: 'effectScatter', coordinateSystem: worldOk ? 'geo' : 'cartesian2d',
                        data: (() => {
                            const top5 = [...scatterData].sort((a,b) => (b.value?b.value[2]:b.count) - (a.value?a.value[2]:a.count)).slice(0, 5);
                            return top5.map(d => ({name: d.name, value: [d.value[0]||d.lng, d.value[1]||d.lat, d.value[2]||d.count]}));
                        })(),
                        symbolSize: v => Math.max(10, Math.min(34, v[2] * 3.4)),
                        rippleEffect: { brushType: 'stroke', scale: 3.2 },
                        itemStyle: { color: '#f59e0b', shadowBlur: 12, shadowColor: 'rgba(245,158,11,.6)' },
                        encode: { value: 2 },
                        label: { show: true, formatter: p => `🔥 ${p.name}`, position: 'right', color: '#d97706', fontSize: 11, fontWeight: 600 }
                    }]
                };
                if (worldOk) {
                    mapOption.geo = { map: 'world', roam: true, zoom: 1.2, left: 0, right: 0,
                        label: { show: false }, itemStyle: { areaColor: '#dbeafe', borderColor: '#ffffff' },
                        emphasis: { itemStyle: { areaColor: '#0ea5e9' } } };
                } else {
                    // 降级：无底图时用经纬度直角坐标系展示散点
                    mapOption.xAxis = { type: 'value', min: -180, max: 180, show: false };
                    mapOption.yAxis = { type: 'value', min: -60, max: 85, show: false };
                    mapOption.grid = { left: 10, right: 10, top: 10, bottom: 10 };
                    mapOption.series[0].data = mapOption.series[0].data.map(d =>
                        ({ name: d.name, value: [d.value[0], d.value[1], d.value[2]] }));
                }
                mapChart.setOption(mapOption);

                // 国家柱状图
                const top10 = countries.slice(0, 15);
                drawBarChart('chart-country-bar', top10.map(c => c.name), top10.map(c => c.count));
            } catch(e) { console.error('Map error:', e); }
        }

        // ===== 数据源 =====
        function renderSources(main) {
            main.innerHTML = `

                    <div id="source-health" class="stats-grid" style="grid-template-columns:repeat(3,1fr);"></div>
                    <div class="table-container"><table><thead><tr>
                        <th>名称</th><th>URL</th><th>类型</th><th>节点数</th><th>健康状态</th><th>测速</th><th>操作</th>
                    </tr></thead><tbody id="sources-tbody"></tbody></table></div>
                </div>
                <div id="sources-tab-import" style="${sourcesTab==='import'?'':'display:none;'}">

        // ===== CF 优选 =====
        let cfData = [];
        function ispLabel(isp){ return ({telecom:'📶 电信',mobile:'📶 移动',unicom:'📶 联通',all:'🌐 三网'})[isp] || isp || 'all'; }
        async function loadCfEndpoints(){
            try{
                const sort = (document.getElementById('cf-sort-filter')||{}).value || 'latency';
                const alive = document.getElementById('cf-only-alive')?.checked ? '&only_alive=true' : '';
                const ipv = (document.getElementById('cf-ipver-filter')||{}).value || '';
                const res = await fetch(`${API}/cf/endpoints?limit=20000&sort=${sort}${alive}${ipv?`&ip_version=${ipv}`:''}`);
                if(!res.ok) throw new Error(await res.text());
                const d = await res.json();
                cfData = d.endpoints||[];
                const by = d.by_isp||{}, bv = d.by_ip_version||{};
                const cards = document.getElementById('cf-isp-cards');
                if (cards) cards.innerHTML =
                    ['telecom','mobile','unicom','all'].map(k=>`
                      <div class="stat-card"><div class="stat-value">${by[k]||0}</div>
                      <div class="stat-label">${ispLabel(k)}优选</div></div>`).join('')
                    + `<div class="stat-card"><div class="stat-value">${bv[4]||0}</div><div class="stat-label">IPv4 端点</div></div>`
                    + `<div class="stat-card"><div class="stat-value">${bv[6]||0}</div><div class="stat-label">IPv6 端点</div></div>`;

        function cfLatencyBadge(la){
            if (la == null) return '<span class="text-muted">—</span>';
            const cls = la < 100 ? 'badge-success' : la < 200 ? 'badge-warning' : 'badge-danger';
            return `<span class="badge ${cls}">${la}ms</span>`;
        }
        function cfVerBadge(v){
            if (v === 4) return '<span class="badge badge-success">v4</span>';
            if (v === 6) return '<span class="badge badge-warning">v6</span>';
            return '<span class="badge badge-secondary">域名</span>';
        }
        async function pingCfEndpoints(btn){
            btn.disabled = true; btn.textContent = '⏳ 检测中…';
            try{
                const isp = (document.getElementById('cf-isp-filter')||{}).value || 'any';
                const res = await fetch(`${API}/cf/ping?isp=${isp}&limit=20000`, {method:'POST'});
                if(!res.ok) throw new Error(await res.text());
                showToast('⚡ 延迟检测已启动，约 30-60 秒后自动刷新','success');
                setTimeout(()=>{ loadCfEndpoints(); btn.disabled=false; btn.textContent='⚡ 测延迟'; }, 45000);
            }catch(e){
                showToast('❌ 启动失败: '+e.message,'error');
                btn.disabled=false; btn.textContent='⚡ 测延迟';
            }
        }
        function renderCfTable(){
            const tb = document.getElementById('cf-tbody'); if(!tb) return;
            const f = (document.getElementById('cf-isp-filter')||{}).value || 'any';
            const exp = document.getElementById('cf-export-btn');
            if (exp) exp.href = `${API}/cf/endpoints/export?isp=${f}&limit=20000`;
            const rows = cfData.filter(e=>f==='any'||e.isp===f);
            tb.innerHTML = rows.slice(0,1000).map(e=>{
                const t = e.last_seen_at ? new Date(e.last_seen_at*1000).toLocaleString() : '-';
                return `<tr><td>${cfLatencyBadge(e.latency_ms)}</td><td>${cfVerBadge(e.ip_version)}</td><td><code>${e.host}:${e.port}</code></td><td>${e.remark||''}</td><td>${ispLabel(e.isp)}</td><td class="text-muted">${t}</td></tr>`;
            }).join('') || '<tr><td colspan="6" class="text-muted">暂无数据——先到源列表页点「🔄 全量导入」</td></tr>';
        }
        function copyCfEndpoints(btn){
            const f = (document.getElementById('cf-isp-filter')||{}).value || 'any';
            const lines = cfData.filter(e=>f==='any'||e.isp===f).map(e=>`${e.host}:${e.port}#${e.remark||e.isp}`);
            navigator.clipboard.writeText(lines.join('\n')).then(()=>{
                if (btn) { btn.textContent='✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制当前',1500); }
                else showToast(`✅ 已复制 ${lines.length} 条端点`);
            }).catch(()=>showToast('复制失败，请用导出 txt','error'));
        }

                if(lg && s.log && s.log.length && lg.dataset.n !== String(s.log.length)){

        async function importSingleNode() {
            const g = id => document.getElementById(id).value.trim();
            const out = document.getElementById('imp-single-result');
            const type = g('imp-single-type');
            const secret = g('imp-single-secret') || null;
            // 按协议把 secret 映射到正确字段名
            let body = {
                type, server: g('imp-single-server'),
                port: parseInt(g('imp-single-port')) || 0,
                password: secret, uuid: secret,
                cipher: g('imp-single-cipher') || null, sni: g('imp-single-sni') || null,
                name: g('imp-single-name') || null
            };
            // 合并扩展参数 JSON（承载 wireguard 的 public_key/private_key 等）
            const extraRaw = g('imp-single-extra');
            if (extraRaw) {
                try { Object.assign(body, JSON.parse(extraRaw)); }
                catch(e) { return showToast('扩展参数 JSON 格式错误', 'error'); }
            }
            // 按类型裁剪无用字段，避免后端困惑
            const NEED_UUID = ['vmess','vless','tuic'];
            const NEED_PWD = ['ss','trojan','hysteria2','hy2','snell'];
            if (!NEED_UUID.includes(type)) delete body.uuid;
            if (!NEED_PWD.includes(type) && !['socks5','http','ssr','wireguard','hysteria'].includes(type)) delete body.password;
            if (type === 'wireguard') { delete body.password; delete body.uuid; }
            if (type === 'hysteria') { delete body.uuid; }
            if (!body.server || !body.port) return showToast('请填服务器和端口', 'error');
            try {
                const res = await fetch(`${API}/nodes/import/single`, { method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(body) });
                const d = await res.json();
                if (res.ok) { out.textContent = `✅ 已保存: ${d.name}`; showToast('节点已入库'); }
                else { out.textContent = '❌ ' + (d.detail||''); }
            } catch(err) { out.textContent = '❌ 网络错误'; }
        }

        async function loadSources() {
            try {
                const [sources, health, stats] = await Promise.all([
                    fetch(`${API}/sources`).then(r=>r.json()),
                    fetch(`${API}/sources/health`).then(r=>r.json()),
                    fetch(`${API}/nodes/stats`).then(r=>r.json())
                ]);
                const healthEl = document.getElementById('source-health');
                const tbodyEl = document.getElementById('sources-tbody');
                if (!healthEl || !tbodyEl) return;  // 页面已切换，放弃本次渲染（修复跨页 null 崩溃）
                const total = sources.length, healthy = health.filter(h => h.healthy).length;
                const nodeCount = (stats && stats.total) || 0;  // 真实节点总数（源未关联节点时 reduce 恒为 0）
                healthEl.innerHTML = `
                    <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">数据源总数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#16a34a;">${healthy}</div><div class="stat-label">健康源</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#2563eb;">${nodeCount}</div><div class="stat-label">累计节点</div></div>
                `;
                const tbody = tbodyEl;
                if (!sources.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty"><div class="empty-icon">📭</div>暂无数据源，点击"预置源"一键导入</td></tr>'; return; }
                tbody.innerHTML = sources.map(s => {
                    const h = health.find(h => h.id === s.id);
                    const st = h ? (h.state || (h.healthy ? 'healthy' : 'unhealthy'))
                                 : (s.last_status === 1 && s.enabled ? 'healthy' : (s.last_status === 0 ? 'pending' : 'unhealthy'));
                    const stest = s.speed_test === undefined || s.speed_test === null ? 1 : s.speed_test;
                    const badge = st === 'healthy' ? '<span class="badge badge-success">健康</span>'
                                : st === 'pending' ? '<span class="badge badge-info">待抓取</span>'
                                : `<span class="badge badge-danger">异常${(s.fail_count||0) >= 3 ? '×'+s.fail_count : ''}</span>`;
                    return `<tr><td>${s.name}</td>
                        <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;font-size:12px;" title="${s.url}">${s.url}</td>
                        <td><span class="badge badge-info">${s.source_type}</span></td>
                        <td>${s.node_count||0}</td>
                        <td>${badge}</td>
                        <td>
                            <button class="btn btn-sm ${stest ? 'btn-primary' : 'btn-secondary'}" onclick="toggleSpeedTest(${s.id},${stest?0:1})"
                                title="是否参与延迟/测速">${stest ? '⚡测速中' : '⏸️跳过'}</button>
                        </td>
                        <td>
                            <button class="btn btn-sm ${s.enabled ? 'btn-secondary' : 'btn-primary'}" onclick="toggleSource(${s.id},${!s.enabled})">${s.enabled ? '禁用' : '启用'}</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSource(${s.id})">删除</button>
                        </td></tr>`;
                }).join('');
            } catch(e) { console.error(e); showToast('数据源加载失败: ' + (e.message||'网络错误'), 'error'); }
        }

        let _ckTimer = null;

        async function pollCheckProgress() {
            if (_ckTimer) { clearTimeout(_ckTimer); _ckTimer = null; }
            if (currentPage !== 'check') return;
            try {
                const d = await (await fetch(`${API}/check/progress`)).json();
                renderProgress(d);
                // running 时 2s 快轮询，否则 6s 慢轮询（页面保持时）
                _ckTimer = setTimeout(pollCheckProgress, d.status === 'running' ? 2000 : 6000);
            } catch(e) { _ckTimer = setTimeout(pollCheckProgress, 8000); }
        }

        function renderProgress(d) {
            const box = document.getElementById('ck-progress');
            if (!box || currentPage !== 'check') return;
            if (d.status === 'idle' || (!d.job_id && d.status !== 'running')) { box.innerHTML = ''; return; }

            const running = d.status === 'running';
            const srcBadge = d.source === 'manual'
                ? '<span class="badge badge-info">🧑‍💻 前台 · 手动触发</span>'
                : '<span class="badge badge-secondary">⏰ 后台 · 定时调度</span>';
            const MODE_NAMES = { latency:'🚀 仅延迟', speed:'⚡ 延迟+速度', full:'🔬 全量' };
            const modeBadge = d.mode ? `<span class="badge badge-info">${MODE_NAMES[d.mode] || escHtml(d.mode)}</span>` : '';
            const stBadge = running
                ? '<span class="badge badge-warning"><span class="loading" style="width:12px;height:12px;border-width:2px;"></span> 运行中</span>'
                : d.status === 'completed' ? '<span class="badge badge-success">✅ 已完成</span>'
                : d.status === 'failed' ? '<span class="badge badge-danger">❌ 失败</span>' : `<span class="badge badge-secondary">${d.status}</span>`;
            const dur = d.elapsed != null ? `${Math.floor(d.elapsed/60)}分${Math.round(d.elapsed%60)}秒` : '--';

            // 步骤条
            const steps = (d.phases || []).map((name, i) => {
                let cls = '', icon = '⬜';
                if (d.phase_idx == null) { cls = ''; }
                else if (i < d.phase_idx || (!running && d.phase_idx >= i && d.status === 'completed')) { cls = 'done'; icon = '✅'; }
                else if (i === d.phase_idx) { cls = running ? 'active' : 'active'; icon = running ? '🔄' : '⏸'; }
                return `<div style="flex:1;text-align:center;">
                    <div style="font-size:22px;margin-bottom:4px;">${icon}</div>
                    <div style="font-size:12px;color:${cls==='active'&&running?'var(--primary)':'var(--text-muted)'};font-weight:${cls==='active'?600:400};">${name}</div>
                    ${i < (d.phases||[]).length-1 ? '' : ''}

            const ov = {};
            const map = {'ov-concurrent':'concurrent','ov-timeout':'timeout','ov-min-speed':'min-speed',
                         'ov-download-mb':'download-mb','ov-download-timeout':'download-timeout',
                         'ov-speed-concurrent':'speed-concurrent','ov-max-sources':'max_sources'};
            for (const [elId, key] of Object.entries(map)) {
                const el = document.getElementById(elId);
                if (el && el.value !== '' && el.value != null) ov[key] = isNaN(Number(el.value)) ? el.value : Number(el.value);

            try {

                const body = Object.keys(ov).length ? JSON.stringify(ov) : undefined;
                const r = await (await fetch(`${API}/check/run?${qs}`, {

        async function doPremiumGenerate() {
            if (window._pvBusy) return;
            window._pvBusy = true;
            const btn = document.getElementById('pv-gen'), st = document.getElementById('pv-status');
            btn.disabled = true; btn.innerHTML = '<span class="loading"></span> 生成中…';
            st.textContent = '正在把 CF 优质端点套入 ws 模板…';
            try {
                const r = await fetch(API + '/cf/convert', { method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        count: parseInt(document.getElementById('pv-count').value) || 100,
                        isp: document.getElementById('pv-isp').value || null }) });
                const d = await r.json();
                if (d.ok === false) throw new Error(d.error || '生成失败');
                showToast(`已生成 ${d.generated} 个优选节点入库`);
                st.textContent = `✅ 模板 #${(d.template||{}).id} (${(d.template||{}).type}) × ${d.generated} 端点 → 入库成功，等下一轮统一测速后即可订阅`;
            } catch(e) {
                showToast('生成失败: ' + e.message, 'error');
                st.textContent = '';
            } finally {
                window._pvBusy = false;
                btn.disabled = false; btn.innerHTML = '⚡ 生成优选节点';
            }
        }

        function buildPremiumLink() {
            const fmt = document.getElementById('pv-fmt').value;
            const parts = [`limit=5000`];
            const ms = document.getElementById('pv-minscore').value;
            const ml = document.getElementById('pv-maxlat').value;
            const c = document.getElementById('pv-country').value.trim();
            const p = document.getElementById('pv-proto').value.trim();
            if (ms) parts.push(`min_score=${ms}`);
            if (ml) parts.push(`max_latency=${ml}`);
            if (c) parts.push(`country=${encodeURIComponent(c)}`);
            if (p) parts.push(`proto=${encodeURIComponent(p)}`);
            const link = `${location.origin}/api/nodes/subscribe?fmt=${fmt}&${parts.join('&')}`;
            window._pvLink = link;
            document.getElementById('pv-link').textContent = link;
            document.getElementById('pv-copy').style.display = '';
            document.getElementById('pv-link-box').style.display = '';
            const qr = document.getElementById('pv-qr');
            qr.innerHTML = '';
            try { new QRCode(qr, { text: link, width: 180, height: 180, colorDark: '#2563eb', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch(e) {}
            showToast('优选订阅链接已生成');
        }

        async function doConvert() {
            if (convertBusy) return;
            const input = document.getElementById('cv-input').value.trim();
            if (!input) return showToast('请先输入订阅链接或节点内容', 'error');
            convertBusy = true;
            try { sessionStorage.setItem('cv_input', input); } catch(e) {}

            const body = {
                input,
                target: document.getElementById('cv-target').value,
                include: document.getElementById('cv-include').value.trim(),
                exclude: document.getElementById('cv-exclude').value.trim(),
                dedupe: document.getElementById('cv-dedupe').checked,
            };
            const btn = document.getElementById('cv-go');
            const st = document.getElementById('cv-status');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 转换中…';
            st.textContent = '正在拉取订阅并解析…';

            try {
                const r = await fetch(API + '/convert', { method:'POST',
                    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
                const d = await r.json();
                renderConvertResult(d);
            } catch(e) {
                showToast('转换请求失败: ' + e, 'error');
                st.textContent = '';
            } finally {
                convertBusy = false;
                btn.disabled = false;
                btn.innerHTML = '🚀 开始转换';
            }
        }

        function renderConvertResult(d) {
            const box = document.getElementById('cv-result');
            const st = document.getElementById('cv-status');
            st.textContent = '';
            if (!d.ok) {
                box.innerHTML = `<div class="chart-container" style="border-color:#fecaca;">
                    <div style="font-weight:600;color:var(--danger);margin-bottom:8px;">❌ 转换失败</div>
                    ${(d.errors||[]).map(e=>`<div class="text-muted" style="font-size:13px;">• ${escHtml(e)}</div>`).join('') || '<div class="text-muted">未知错误</div>'}
                </div>`;
                return;
            }
            const fmtName = (CONVERT_FORMATS.find(f=>f.key===d.target)||{}).name || d.target;
            window._cvContent = d.content;
            box.innerHTML = `
                <div class="chart-container">
                    <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:12px;">
                        <div style="font-weight:600;">📤 转换结果 <span class="badge badge-info">${fmtName}</span></div>
                        <div class="flex">
                            <button class="btn btn-secondary btn-sm" onclick="copyText(window._cvContent)">📋 复制</button>
                            <button class="btn btn-secondary btn-sm" onclick="downloadConvert()">⬇ 下载文件</button>
                        </div>
                    </div>
                    <div class="flex mb-4">
                        <span class="badge badge-success">📡 拉取订阅 ${d.fetched}</span>
                        <span class="badge badge-warning">🧩 解析节点 ${d.parsed}</span>
                        <span class="badge badge-info">✅ 导出 ${d.exported}</span>
                        <span class="badge badge-secondary">${(d.content.length/1024).toFixed(1)} KB</span>
                    </div>
                    <textarea id="cv-output" class="form-input" readonly style="min-height:260px;font-family:monospace;font-size:12px;background:var(--surface-2);">${escHtml(d.content.slice(0, 200000))}${d.content.length>200000?'\n… (内容过长已截断显示，复制/下载仍为完整内容)':''}</textarea>
                    ${(d.errors&&d.errors.length)?`<details style="margin-top:10px;"><summary class="text-muted" style="cursor:pointer;font-size:13px;">⚠️ ${d.errors.length} 条警告</summary>${d.errors.map(e=>`<div class="text-muted" style="font-size:12px;">• ${escHtml(e)}</div>`).join('')}</details>`:''}
                </div>`;
            showToast(`✅ 转换完成：导出 ${d.exported} 个节点`);
        }

        function downloadConvert() {
            const c = window._cvContent || '';
            const ext = ({clash:'yaml','clash-meta':'yaml',singbox:'json'})[document.getElementById('cv-target')?.value] || 'txt';
            const blob = new Blob([c], {type:'text/plain;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `sanl_convert_${Date.now()}.${ext}`;
            a.click(); URL.revokeObjectURL(a.href);
        }

        // ===== Token 管理 =====
        function renderTokens(main) {
            fetch(`${API}/tokens/stats`).then(r=>r.json()).then(d => {
                const items = (d.items||[]).filter(x => x.total_hits > 0);

                const box = document.createElement('div');
                box.className = 'chart-container';
                const gb = b => b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB' : b >= 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB';
                const hdr = '\u8ba2\u9605\u5206\u53d1\u7edf\u8ba1';
                box.innerHTML = `<h3 style="margin-bottom:12px;">\uD83D\uDCC8 ${hdr}</h3>
                    <div class="table-container" style="box-shadow:none;"><table><thead><tr>
                    <th>Token</th><th>\u603b\u8bbf\u95ee</th><th>\u4eca\u65e5</th><th>\u7d2f\u8ba1\u6d41\u91cf</th><th>\u5747\u8282\u70b9\u6570</th><th>\u6700\u8fd1 UA</th><th>\u6700\u8fd1\u8bbf\u95ee</th></tr></thead><tbody>
                    ${items.map(x => `<tr><td>${(x.label||'').slice(0,18)}</td><td>${x.total_hits}</td><td>${x.today_hits||0}</td>

                    </tbody></table></div>`;
                main.insertBefore(box, main.querySelector('.page-header').nextSibling);
            }).catch(()=>{});
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">🔑 令牌管理</h1>
                    <button class="btn btn-primary" onclick="showCreateTokenModal()">➕ 创建 Token</button>
                </div>
                <div class="table-container"><table><thead><tr>
                    <th>ID</th><th>名称</th><th>Token 预览</th><th>权限</th><th>状态</th><th>最后使用</th><th>操作</th>
                </tr></thead><tbody id="tokens-tbody"></tbody></table></div>
            `;

        async function loadTokens() {
            try {
                const tokens = await (await fetch(`${API}/tokens`)).json();
                const tbody = document.getElementById('tokens-tbody');
                if (!tbody || currentPage !== 'tokens') return;  // 页面已切换，放弃本次渲染
                if (!tokens.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty"><div class="empty-icon">🔑</div>暂无 Token，点击"创建 Token"生成订阅访问凭证</td></tr>'; return; }

                    <tr><td>#${t.id}</td><td>${t.name}</td>
                        <td style="font-family:monospace;font-size:12px;">${t.token_preview || t.token.slice(0,8)+'...'}</td>
                        <td><span class="badge badge-info">${t.permissions}</span></td>
                        <td><span class="badge ${t.is_active ? 'badge-success' : 'badge-danger'}">${t.is_active ? '启用' : '禁用'}</span></td>

                            <button class="btn btn-sm btn-secondary" onclick="showQuotaModal(${t.id},'${t.name}')" title="流量限额（大纲 J.2）">📊 限额</button>

                        </td></tr>
                `).join('');

        }

        function showCreateTokenModal() {
            document.getElementById('modal-overlay').classList.add('show');
            document.getElementById('modal-content').innerHTML = `
                <div class="modal-header"><h2 class="modal-title">➕ 创建 Token</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
                <div class="form-group"><label class="form-label">名称</label><input class="form-input" id="tk-name" placeholder="如: 我的手机订阅"></div>
                <div class="form-group"><label class="form-label">权限</label>
                    <select class="form-input" id="tk-perm"><option value="read">read（只读订阅）</option><option value="write">read-write</option></select>
                </div>
                <div class="flex" style="justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doCreateToken()">创建</button></div>
            `;
        }

        let newTokenValue = '';
        async function doCreateToken() {
            const name = document.getElementById('tk-name').value || 'default';
            const permissions = document.getElementById('tk-perm').value;
            try {
                const res = await fetch(`${API}/tokens`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, permissions})});
                const data = await res.json();
                newTokenValue = data.token;
                document.getElementById('modal-content').innerHTML = `
                    <div class="modal-header"><h2 class="modal-title">✅ Token 创建成功</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    <p class="text-muted mb-4">请立即保存此 Token（仅显示一次）：</p>
                    <div class="token-display">${data.token}</div>
                    <div class="flex mt-4">
                        <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${data.token}');showToast('已复制')">📋 复制</button>
                        <button class="btn btn-secondary" onclick="closeModal();loadTokens()">完成</button>
                    </div>
                `;
            } catch(e) { showToast('创建失败', 'error'); }
        }

        async function showQuotaModal(id, name) {
            let used = 0, limit = 0;
            try {
                const q = await (await fetch(`${API}/token/${id}/quota`)).json();
                used = q.used_mb || 0; limit = q.limit_mb || 0;
            } catch(e) {}
            document.getElementById('modal-overlay').classList.add('show');
            document.getElementById('modal-content').innerHTML = `
                <div class="modal-header"><h2 class="modal-title">📊 流量限额 — ${name}</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
                <p class="text-muted mb-4">已用 <b>${used.toFixed(1)} MB</b>${limit > 0 ? ` / 配额 ${limit} MB` : ''}（按订阅输出累计流量计）</p>
                <div class="form-group"><label class="form-label">月度限额 MB（0 = 不限流，超限后该 Token 订阅返回 429）</label>
                    <input class="form-input" id="tk-quota-mb" type="number" min="0" step="100" value="${limit > 0 ? limit : 0}"></div>
                <div class="flex" style="justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doSaveQuota(${id})">保存</button></div>
            `;
        }
        async function doSaveQuota(id) {
            const v = parseFloat(document.getElementById('tk-quota-mb').value) || 0;
            try {
                const r = await (await fetch(`${API}/token/${id}/traffic-limit?limit_mb=${v}`, { method: 'POST' })).json();
                if (r.status === 'ok') { showToast(`✅ 限额已保存：${v > 0 ? v + ' MB' : '不限流'}`, 'success'); closeModal(); }
            } catch(e) { showToast('❌ 保存失败', 'error'); }
        }

        async function toggleToken(id, active) {
            await fetch(`${API}/tokens/${id}/toggle?is_active=${active}`, {method:'PUT'});
            showToast(active ? '已启用' : '已禁用');
            loadTokens();
        }
        async function deleteToken(id) {
            if (!confirm('确定删除此 Token？使用它的订阅链接将立即失效')) return;
            await fetch(`${API}/tokens/${id}`, {method:'DELETE'});
            showToast('已删除');
            loadTokens();
        }


        // ===== 🌒 主题切换 + i18n + 📱 底部Tab（v2.3）=====
        const I18N = {
            zh: { overview:'总览', pool:'节点池', cf:'CF 优选', tools:'转换工具',
                  dashboard:'仪表盘', nodes:'节点列表', map:'世界地图', sources:'节点源',
                  subscribe_out:'订阅输出', tokens:'令牌管理', check:'测速任务',
                  cfendpoints:'优选端点', cfscan:'网段扫描', convert:'订阅转换' },
            en: { overview:'Overview', pool:'Sanl', cf:'CF Preferred', tools:'Tools',

                  cfendpoints:'Endpoints', cfscan:'Subnet Scan', convert:'Convert' }
        };

            const dict = I18N[curLang] || I18N.zh;

            curLang = curLang === 'zh' ? 'en' : 'zh';

            document.querySelectorAll('.nav-group').forEach((el,i) => {
                const keys = ['overview','pool','cf','tools'];
                if (keys[i]) el.textContent = I18N[curLang][keys[i]];
            });
            document.querySelectorAll('nav:not(#bottom-tab) .nav-item').forEach(el => {
                const p = el.dataset.page; if (I18N[curLang][p]) {
                    const icon = el.textContent.trim().split(/\s+/)[0];
                    el.textContent = icon + ' ' + I18N[curLang][p];
                }
            });
            document.querySelectorAll('#bottom-tab span[i18n]').forEach(el => applyLang());
            try { if (typeof currentPage !== 'undefined') goPage(currentPage); } catch(e) {}

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? '' : 'dark';
            if (next) html.setAttribute('data-theme', next); else html.removeAttribute('data-theme');
            localStorage.setItem('np_theme', next || 'light');
            const tb = document.getElementById('theme-btn'); if (tb) tb.textContent = next === 'dark' ? '☀️' : '🌙';
            try { if (typeof currentPage !== 'undefined' && currentPage) goPage(currentPage); } catch(e) {}

        (function initTheme(){
            const t = localStorage.getItem('np_theme');
            if (t === 'dark') { document.documentElement.setAttribute('data-theme','dark');
                const tb = document.getElementById('theme-btn'); if (tb) tb.textContent = '☀️'; }

        // 侧边栏状态刷新：立即执行一次，之后每 30 秒刷新
        async function refreshSidebarStats() {
            try {
                const stats = await (await fetch(`${API}/nodes/stats`)).json();
                const el = document.getElementById('total-nodes');
                if (el) el.textContent = `总节点: ${stats.total}`;
            } catch(e) {}
            // 「最近检查」：取最近一次已完成的测速任务时间（原始终显示 "--"）
            try {
                const h = await (await fetch(`${API}/check/history?limit=20`)).json();
                const done = (Array.isArray(h) ? h : []).find(j => j.status === 'completed' && j.finished_at);
                const el = document.getElementById('last-check');
                if (el) {
                    el.textContent = done

                        : '最近检查: --';
                }
            } catch(e) {}
        }
        refreshSidebarStats();
        setInterval(refreshSidebarStats, 10000);  // 刷新提速：30s→10s

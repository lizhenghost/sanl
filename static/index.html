<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodePool - 节点池聚合平台</title>
    <script src="/vendor/echarts.min.js?v=5.4.3"></script>
    <script src="/vendor/qrcode.min.js?v=1.0.0" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: #1e293b; padding: 20px; flex-shrink: 0; display: flex; flex-direction: column; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .logo { font-size: 24px; font-weight: bold; color: #38bdf8; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .logo span { color: #94a3b8; font-size: 14px; font-weight: normal; }
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
        .nav-item:hover { background: #334155; }
        .nav-item.active { background: #0ea5e9; color: white; }
        .sidebar-footer { margin-top: auto; padding-top: 20px; color: #64748b; font-size: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
        .stat-value { font-size: 36px; font-weight: bold; color: #38bdf8; }
        .stat-label { color: #94a3b8; margin-top: 8px; }
        .table-container { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 20px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #0f172a; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: #334155; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-success { background: #22c55e; color: white; }
        .badge-warning { background: #f59e0b; color: white; }
        .badge-danger { background: #ef4444; color: white; }
        .badge-info { background: #3b82f6; color: white; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: #94a3b8; margin-bottom: 8px; font-size: 14px; }
        .form-input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 14px; }
        .form-input:focus { outline: none; border-color: #0ea5e9; }
        select.form-input { cursor: pointer; }
        textarea.form-input { min-height: 100px; font-family: monospace; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: #1e293b; border-radius: 16px; padding: 30px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: bold; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        .chart-container { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        .chart { height: 300px; }
        .chart-tall { height: 500px; }
        .page-title { font-size: 28px; font-weight: bold; margin-bottom: 24px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .empty { text-align: center; padding: 60px 20px; color: #64748b; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #334155; border-radius: 50%; border-top-color: #0ea5e9; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; color: white; z-index: 2000; animation: slideIn 0.3s; }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex-center { align-items: center; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .text-muted { color: #64748b; }
        .token-display { background: #0f172a; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px; word-break: break-all; user-select: all; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .preset-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.2s; }
        .preset-card:hover { border-color: #0ea5e9; }
        .preset-card.selected { border-color: #22c55e; background: #1a2e3b; }
        .preset-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .preset-name { font-weight: 600; margin-bottom: 4px; }
        .preset-url { font-size: 11px; color: #64748b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; padding: 10px 12px; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
            .sidebar .logo { white-space: nowrap; margin-bottom: 0; }
            .sidebar nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .sidebar nav::-webkit-scrollbar { display: none; }
            .nav-item { white-space: nowrap; font-size: 13px; padding: 8px 10px; }
            .main { padding: 12px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .grid-2 { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .page-title { font-size: 20px; }
            .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .table-container table { min-width: 560px; }
            .chart { height: 240px !important; }
            .flex { flex-wrap: wrap; gap: 8px; }
        }
        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .nav-item { font-size: 12px; padding: 7px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">🌐 NodePool <span>v2.0</span></div>
            <nav>
                <div class="nav-item active" data-page="dashboard">📊 仪表盘</div>
                <div class="nav-item" data-page="nodes">🔗 节点列表</div>
                <div class="nav-item" data-page="map">🌍 世界地图</div>
                <div class="nav-item" data-page="sources">📡 数据源</div>
                <div class="nav-item" data-page="check">⚡ 测速任务</div>
                <div class="nav-item" data-page="subscribe">📥 订阅输出</div>
                <div class="nav-item" data-page="tokens">🔑 令牌管理</div>
            </nav>
            <div class="sidebar-footer">
                <div id="last-check">最近检查: --</div>
                <div id="total-nodes">总节点: 0</div>
            </div>
        </aside>
        <main class="main" id="main-content"></main>
    </div>
    <div id="toast-container"></div>
    <!-- 通用模态框 -->
    <div class="modal" id="modal-overlay">
        <div class="modal-content" id="modal-content"></div>
    </div>

    <script>
        const API = '/api';
        let currentPage = 'dashboard';
        let allNodes = [];

        // ===== 页面渲染 =====
        function showToast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentPage = item.dataset.page;
                renderPage(currentPage);
            });
        });

        function renderPage(page) {
            const main = document.getElementById('main-content');
            switch(page) {
                case 'dashboard': renderDashboard(main); break;
                case 'nodes': renderNodes(main); break;
                case 'map': renderMap(main); break;
                case 'sources': renderSources(main); break;
                case 'check': renderCheck(main); break;
                case 'subscribe': renderSubscribe(main); break;
                case 'tokens': renderTokens(main); break;
            }
        }

        // ===== 仪表盘 =====
        function renderDashboard(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">📊 仪表盘</h1>
                    <div class="flex">
                        <button class="btn btn-secondary" onclick="loadDashboard()">🔄 刷新</button>
                        <button class="btn btn-primary" onclick="runCheck()">⚡ 立即测速</button>
                    </div>
                </div>
                <div class="stats-grid" id="dash-stats"></div>
                <div class="grid-2">
                    <div class="chart-container"><h3 style="margin-bottom:12px;">国家分布</h3><div id="chart-country" class="chart"></div></div>
                    <div class="chart-container"><h3 style="margin-bottom:12px;">协议分布</h3><div id="chart-type" class="chart"></div></div>
                </div>
                <div class="chart-container"><h3 style="margin-bottom:12px;">延迟分布</h3><div id="chart-latency" class="chart" style="height:200px;"></div></div>
                <div class="chart-container"><h3 style="margin-bottom:12px;">📈 测速历史趋势</h3><div id="chart-trend" class="chart" style="height:240px;"></div></div>
            `;
            loadDashboard();
        }

        async function loadDashboard() {
            try {
                const [statsRes, nodesRes, sourcesRes, rankRes] = await Promise.all([
                    fetch(`${API}/nodes/stats`), fetch(`${API}/nodes?limit=100`),
                    fetch(`${API}/sources`), fetch(`${API}/ranking?limit=5`)
                ]);
                const stats = await statsRes.json();
                const nodes = await nodesRes.json();
                const sources = await sourcesRes.json();
                const rank = await rankRes.json();
                allNodes = nodes;

                if (!document.getElementById('dash-stats')) return;  // 用户已切走页面，放弃本次渲染

                const active = stats.active || 0, total = stats.total || 0;
                document.getElementById('total-nodes').textContent = `总节点: ${total}`;
                document.getElementById('dash-stats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">总节点数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#22c55e;">${active}</div><div class="stat-label">可用节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#f59e0b;">${sources.length}</div><div class="stat-label">数据源数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#38bdf8;">${rank.stats?.avg_score || 0}</div><div class="stat-label">平均评分</div></div>
                `;

                const activeNodes = nodes.filter(n => n.status === 'active');
                drawPieChart('chart-country', Object.entries(stats.countries || {}).map(([k,v]) => ({name:k,value:v})));
                const types = {}; nodes.forEach(n => { types[n.node_type] = (types[n.node_type]||0)+1; });
                drawPieChart('chart-type', Object.entries(types).map(([k,v]) => ({name:k.toUpperCase(),value:v})));
                const ranges = {'0-100ms':0,'100-200ms':0,'200-500ms':0,'500ms+':0};
                activeNodes.forEach(n => { if(n.latency<100) ranges['0-100ms']++; else if(n.latency<200) ranges['100-200ms']++; else if(n.latency<500) ranges['200-500ms']++; else ranges['500ms+']++; });
                drawBarChart('chart-latency', Object.keys(ranges), Object.values(ranges));
                // 历史趋势
                try {
                    const trend = await (await fetch(`${API}/stats/trend?limit=30`)).json();
                    drawTrendChart('chart-trend', trend);
                } catch(e) { console.warn('trend load failed', e); }
            } catch(e) { console.error('Dashboard error:', e); }
        }

        function drawTrendChart(id, trend) {
            const el = document.getElementById(id);
            if (!el) return;
            const chart = echarts.init(el);
            if (!trend || !trend.length) {
                el.innerHTML = '<div class="empty">暂无测速历史，跑一次测速后生成趋势</div>';
                return;
            }
            const times = trend.map(t => t.time ? new Date(t.time*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-');
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['存活节点','总节点'], textStyle: { color: '#94a3b8' } },
                grid: { left: 40, right: 16, bottom: 24, top: 36 },
                xAxis: { type: 'category', data: times, axisLabel: { color: '#64748b', fontSize: 10 } },
                yAxis: { type: 'value', axisLabel: { color: '#64748b' }, splitLine: { lineStyle: { color: '#1e293b' } } },
                series: [
                    { name: '存活节点', type: 'line', smooth: true, data: trend.map(t=>t.alive), itemStyle: { color: '#22c55e' }, areaStyle: { opacity: 0.15 } },
                    { name: '总节点', type: 'line', smooth: true, data: trend.map(t=>t.total), itemStyle: { color: '#38bdf8' } }
                ]
            });
        }

        function drawPieChart(id, data) {
            const _el = document.getElementById(id);
            if (!_el) return;  // 页面已切换，放弃渲染（修复跨页 null 崩溃）
            const chart = echarts.init(_el);
            chart.setOption({ tooltip:{trigger:'item'}, series:[{type:'pie',radius:['40%','70%'],data,label:{show:true,formatter:'{b}: {c}'}}] });
        }
        function drawBarChart(id, x, y) {
            const _el = document.getElementById(id);
            if (!_el) return;  // 页面已切换，放弃渲染
            const chart = echarts.init(_el);
            chart.setOption({ tooltip:{trigger:'axis'}, xAxis:{type:'category',data:x}, yAxis:{type:'value'}, series:[{data:y,type:'bar',itemStyle:{color:'#0ea5e9'}}] });
        }

        // ===== 节点列表 =====
        function renderNodes(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">🔗 节点列表</h1>
                    <div class="flex">
                        <select class="form-input" style="width:120px;" id="nf-status" onchange="loadNodes()">
                            <option value="">全部状态</option>
                            <option value="active">可用</option>
                            <option value="inactive">不可用</option>
                        </select>
                        <select class="form-input" style="width:120px;" id="nf-type" onchange="loadNodes()">
                            <option value="">全部协议</option>
                            <option value="vmess">VMess</option>
                            <option value="vless">VLESS</option>
                            <option value="ss">SS</option>
                            <option value="trojan">Trojan</option>
                            <option value="hysteria2">Hy2</option>
                        </select>
                        <select class="form-input" style="width:130px;" id="nf-sort" onchange="loadNodes()">
                            <option value="latency">按延迟</option>
                            <option value="score">按评分</option>
                            <option value="speed">按速度</option>
                            <option value="created">按新增</option>
                            <option value="country">按国家</option>
                        </select>
                        <select class="form-input" style="width:130px;" id="nf-src" onchange="loadNodes()">
                            <option value="">全部来源</option>
                            <option value="manual">🛠 手动导入</option>
                            <option value="auto">🤖 系统优选</option>
                        </select>
                        <select class="form-input" style="width:100px;" id="nf-order" onchange="loadNodes()">
                            <option value="asc">升序</option>
                            <option value="desc">降序</option>
                        </select>
                        <input class="form-input" style="width:200px;" id="nf-search" placeholder="搜索..." oninput="filterNodes()">
                    </div>
                </div>
                <div class="table-container"><table><thead><tr>
                    <th>名称</th><th>协议</th><th>国家</th><th>延迟</th><th>速度</th><th>评分</th><th>等级</th><th>状态</th>
                </tr></thead><tbody id="nodes-tbody"></tbody></table></div>
                <div class="flex-center flex mt-4" id="nodes-pagination"></div>
            `;
            loadNodes();
        }

        let nodePage = 0, nodePageSize = 50;

        async function loadNodes() {
            const status = document.getElementById('nf-status').value;
            const type = document.getElementById('nf-type').value;
            const sort = document.getElementById('nf-sort') ? document.getElementById('nf-sort').value : 'latency';
            const order = document.getElementById('nf-order') ? document.getElementById('nf-order').value : 'asc';
            const src = document.getElementById('nf-src') ? document.getElementById('nf-src').value : '';
            let url = `${API}/nodes?limit=200&sort=${sort}&order=${order}`;
            if (status) url += `&status=${status}`;
            if (type) url += `&node_type=${type}`;
            if (src) url += `&source_type=${src}`;
            try {
                const nodes = await (await fetch(url)).json();
                allNodes = nodes;
                nodePage = 0;
                renderNodePage();
            } catch(e) { console.error(e); }
        }

        function filterNodes() {
            const q = (document.getElementById('nf-search').value || '').toLowerCase();
            if (!q) { renderNodePage(); return; }
            const filtered = allNodes.filter(n => (n.node_name||'').toLowerCase().includes(q) || (n.country||'').includes(q));
            renderNodeTable(filtered);
            const _pg = document.getElementById('nodes-pagination');
            if (_pg) _pg.innerHTML = '';
        }

        function renderNodePage() {
            const pag = document.getElementById('nodes-pagination');
            if (!pag) return;  // 页面已切换，放弃渲染
            const start = nodePage * nodePageSize;
            const page = allNodes.slice(start, start + nodePageSize);
            renderNodeTable(page);
            const total = Math.ceil(allNodes.length / nodePageSize);
            let html = '';
            if (nodePage > 0) html += `<button class="btn btn-sm btn-secondary" onclick="nodePage--;renderNodePage()">上一页</button>`;
            html += `<span class="text-muted" style="padding:0 12px;">${nodePage+1}/${total}</span>`;
            if (start + nodePageSize < allNodes.length) html += `<button class="btn btn-sm btn-secondary" onclick="nodePage++;renderNodePage()">下一页</button>`;
            pag.innerHTML = html;
        }

        function renderNodeTable(nodes) {
            const tbody = document.getElementById('nodes-tbody');
            if (!tbody) return;  // 页面已切换，放弃渲染
            if (!nodes.length) { tbody.innerHTML = '<tr><td colspan="8" class="empty"><div class="empty-icon">📭</div>暂无节点</td></tr>'; return; }
            tbody.innerHTML = nodes.map(n => {
                const speed = n.download_speed ? (n.download_speed >= 1048576 ? (n.download_speed/1048576).toFixed(1)+'MB/s' : Math.round(n.download_speed/1024)+'KB/s') : '-';
                const score = n.score || 0;
                const scoreColor = score >= 50 ? '#22c55e' : score >= 20 ? '#f59e0b' : '#64748b';
                const statusClass = n.status === 'active' ? 'badge-success' : n.status === 'inactive' ? 'badge-danger' : 'badge-warning';
                const grade = n.grade ? `<span class="badge ${score>=70?'badge-success':score>=50?'badge-warning':'badge-danger'}">${n.emoji||''} ${n.grade}</span>` : '-';
                return `<tr><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;">${n.node_name||'-'}</td>
                    <td><span class="badge badge-info">${(n.node_type||'').toUpperCase()}</span></td>
                    <td>${n.country||'🌐'}</td>
                    <td>${n.latency ? n.latency+'ms' : '-'}</td><td>${speed}</td>
                    <td style="color:${scoreColor};">${score.toFixed(1)}</td>
                    <td>${grade}</td>
                    <td><span class="badge ${statusClass}">${n.status}</span></td></tr>`;
            }).join('');
        }

        // ===== 世界地图 =====
        let mapChart = null;
        let worldMapReady = null;  // 缓存 registerMap Promise，避免重复加载

        // 本地加载世界地图 GeoJSON 并注册到 ECharts（ECharts 5 不内置地图）
        function ensureWorldMap() {
            if (typeof echarts === 'undefined') {
                return Promise.reject(new Error('echarts 未加载'));
            }
            if (echarts.getMap && echarts.getMap('world')) return Promise.resolve(true);
            if (worldMapReady) return worldMapReady;
            worldMapReady = fetch('/vendor/world.json?v=1')
                .then(r => { if (!r.ok) throw new Error('world.json HTTP ' + r.status); return r.json(); })
                .then(geo => { echarts.registerMap('world', geo); return true; })
                .catch(e => { worldMapReady = null; throw e; });
            return worldMapReady;
        }

        function renderMap(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">🌍 世界地图</h1>
                    <div class="flex">
                        <button class="btn btn-secondary" onclick="loadMapData()">🔄 刷新</button>
                        <button class="btn btn-primary" onclick="refreshGeoIP()">🛰 识别出口位置</button>
                    </div>
                </div>
                <div id="map-stats" class="stats-grid" style="grid-template-columns:repeat(4,1fr);"></div>
                <div class="chart-container"><div id="chart-world" class="chart chart-tall"></div></div>
                <div class="chart-container"><h3 style="margin-bottom:12px;">各国节点数</h3><div id="chart-country-bar" class="chart" style="height:250px;"></div></div>
            `;
            loadMapData();
        }

        async function refreshGeoIP() {
            showToast('GeoIP 识别中（ip-api 免费接口，最多约 1 分钟）...');
            try {
                const res = await fetch(`${API}/geoip/refresh?limit=300`, { method: 'POST' });
                const data = await res.json();
                showToast(`GeoIP 完成：更新 ${data.updated}/${data.total} 个节点出口`);
                loadMapData();
            } catch(e) { showToast('GeoIP 刷新失败: ' + e.message, 'error'); }
        }

        async function loadMapData() {
            try {
                const [mapRes, statsRes] = await Promise.all([fetch(`${API}/map`), fetch(`${API}/nodes/stats`)]);
                const mapData = await mapRes.json();
                const stats = await statsRes.json();

                const countries = mapData.countries || [];
                if (!document.getElementById('map-stats')) return;  // 已离开地图页，放弃本次渲染
                const total = countries.reduce((s,c) => s+c.count, 0);
                document.getElementById('map-stats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${countries.length}</div><div class="stat-label">覆盖国家/地区</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#22c55e;">${total}</div><div class="stat-label">已定位节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#f59e0b;">${stats.active||0}</div><div class="stat-label">可用节点</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#38bdf8;">${stats.total||0}</div><div class="stat-label">总节点</div></div>
                `;

                // 世界地图散点图（先确保本地 GeoJSON 注册成功，失败则降级为纯散点）
                if (mapChart) mapChart.dispose();
                mapChart = echarts.init(document.getElementById('chart-world'));
                const scatterData = mapData.scatter && mapData.scatter.length > 0 ? mapData.scatter :
                    countries.map(c => ({name: c.name, value: [c.lng, c.lat, c.count]}));

                let worldOk = false;
                try { worldOk = await ensureWorldMap(); } catch(e) { console.warn('世界地图底图加载失败:', e); }

                const mapOption = {
                    tooltip: { trigger: 'item', formatter: p => `${p.name}<br/>节点数: ${p.value[2]}` },
                    series: [{
                        type: 'scatter', coordinateSystem: worldOk ? 'geo' : 'cartesian2d',
                        data: scatterData.map(d => ({name: d.name, value: [d.value[0]||d.lng, d.value[1]||d.lat, d.value[2]||d.count]})),
                        symbolSize: v => Math.max(5, Math.min(30, v[2] * 3)),
                        itemStyle: { color: '#38bdf8', opacity: 0.7 },
                        encode: { value: 2 },
                        label: worldOk ? {} : { show: true, formatter: p => p.name, position: 'right', color: '#e2e8f0', fontSize: 10 }
                    }]
                };
                if (worldOk) {
                    mapOption.geo = { map: 'world', roam: true, zoom: 1.2, left: 0, right: 0,
                        label: { show: false }, itemStyle: { areaColor: '#1e293b', borderColor: '#334155' },
                        emphasis: { itemStyle: { areaColor: '#0ea5e9' } } };
                } else {
                    // 降级：无底图时用经纬度直角坐标系展示散点
                    mapOption.xAxis = { type: 'value', min: -180, max: 180, show: false };
                    mapOption.yAxis = { type: 'value', min: -60, max: 85, show: false };
                    mapOption.grid = { left: 10, right: 10, top: 10, bottom: 10 };
                    mapOption.series[0].data = mapOption.series[0].data.map(d =>
                        ({ name: d.name, value: [d.value[0], d.value[1], d.value[2]] }));
                }
                mapChart.setOption(mapOption);

                // 国家柱状图
                const top10 = countries.slice(0, 15);
                drawBarChart('chart-country-bar', top10.map(c => c.name), top10.map(c => c.count));
            } catch(e) { console.error('Map error:', e); }
        }

        // ===== 数据源 =====
        function renderSources(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">📡 数据源与导入</h1>
                    <div class="flex">

                        <p class="text-muted" style="font-size:12px;margin-bottom:8px;">订阅 URL 会被加入源列表，定时测速时自动拉取其中的节点</p>
                        <div class="flex">
                            <input class="form-input" style="flex:1;min-width:200px;" id="imp-sub-name" placeholder="名称（如：我的机场）">

                    </div>
                    <div class="chart-container">
                        <h3 style="margin-bottom:12px;">📋 批量导入节点链接</h3>
                        <p class="text-muted" style="font-size:12px;margin-bottom:8px;">每行一条，支持 ss:// vmess:// vless:// trojan:// hysteria2:// tuic:// 链接、Clash YAML、整段 Base64 订阅</p>
                        <textarea class="form-input" id="imp-batch" rows="6" style="width:100%;font-family:monospace;font-size:12px;" placeholder="ss://YWVzLTEyOC1nY206cGFzcw==@1.2.3.4:443#我的节点&#10;vless://uuid@host:443?security=tls#节点2&#10;vmess://eyJhZGQiOi..."></textarea>
                        <div class="flex mt-4" style="align-items:center;">
                            <input class="form-input" style="width:200px;" id="imp-batch-label" placeholder="分组标签（默认：手动导入）">
                            <button class="btn btn-primary" onclick="importBatchNodes()">⬆️ 批量导入</button>
                            <span id="imp-batch-result" class="text-muted" style="font-size:13px;"></span>
                        </div>
                    </div>
                    <div class="chart-container">
                        <h3 style="margin-bottom:12px;">🖱 手动录入单个节点</h3>
                        <div class="flex" style="flex-wrap:wrap;gap:10px;">
                            <select class="form-input" style="width:130px;" id="imp-single-type">
                                <option value="ss">SS</option><option value="ssr">SSR</option>
                                <option value="vmess">VMess</option>
                                <option value="vless">VLESS</option><option value="trojan">Trojan</option>
                                <option value="hysteria2">Hysteria2</option><option value="tuic">TUIC</option>

                                <option value="snell">Snell</option><option value="wireguard">WireGuard</option>
                            </select>

                            <input class="form-input" style="width:150px;" id="imp-single-sni" placeholder="SNI（可选）">
                            <input class="form-input" style="width:150px;" id="imp-single-name" placeholder="节点名称（可选）">
                            <input class="form-input" style="width:200px;" id="imp-single-extra" placeholder='扩展参数JSON：{"public_key":"…","private_key":"…"}'>
                        </div>
                        <div class="flex mt-4" style="align-items:center;">
                            <button class="btn btn-primary" onclick="importSingleNode()">💾 保存节点</button>
                            <span id="imp-single-result" class="text-muted" style="font-size:13px;"></span>
                        </div>
                    </div>
                </div>
                <div id="sources-tab-cf" style="${sourcesTab==='cf'?'':'display:none;'}">
                    <div id="cf-isp-cards" class="stats-grid" style="grid-template-columns:repeat(4,1fr);"></div>
                    <div class="chart-container">
                        <div class="flex" style="align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
                            <h3 style="margin-right:auto;">🌐 CF 优选端点（按运营商）</h3>
                            <select class="form-input" style="width:150px;" id="cf-isp-filter" onchange="renderCfTable()">
                                <option value="any">全部来源</option>
                                <option value="telecom">📶 电信优选</option>
                                <option value="mobile">📶 移动优选</option>
                                <option value="unicom">📶 联通优选</option>
                                <option value="all">🌐 三网通用</option>
                            </select>
                            <select class="form-input" style="width:130px;" id="cf-sort-filter" onchange="loadCfEndpoints()">
                                <option value="latency">⚡ 延迟优先</option>
                                <option value="id">🕐 默认顺序</option>
                            </select>
                            <label class="text-muted" style="font-size:13px;display:flex;align-items:center;gap:4px;">
                                <input type="checkbox" id="cf-only-alive" onchange="loadCfEndpoints()">仅存活
                            </label>
                            <button class="btn btn-primary" id="cf-ping-btn" onclick="pingCfEndpoints(this)">⚡ 测延迟</button>
                            <button class="btn btn-secondary" onclick="copyCfEndpoints(this)">📋 复制当前</button>
                            <a class="btn btn-secondary" id="cf-export-btn" href="#" target="_blank">⬇️ 导出 txt</a>
                        </div>
                        <p class="text-muted" style="font-size:12px;margin-bottom:8px;">CF 优选 IP/域名仅用于加速自建节点/优选工具，不是可直连的代理节点；延迟为 TCP 握手 RTT（本机视角），每轮「全量导入」自动刷新列表</p>
                        <div class="table-container" style="max-height:480px;overflow-y:auto;"><table><thead><tr>
                            <th>延迟</th><th>端点</th><th>备注</th><th>运营商</th><th>最近发现</th>
                        </tr></thead><tbody id="cf-tbody"></tbody></table></div>
                    </div>
                </div>
            `;
            if (sourcesTab === 'cf') { loadCfEndpoints(); } else { loadSources(); }
        }

        // ===== CF 优选 =====
        let cfData = [];
        function ispLabel(isp){ return ({telecom:'📶 电信',mobile:'📶 移动',unicom:'📶 联通',all:'🌐 三网'})[isp] || isp || 'all'; }
        async function loadCfEndpoints(){
            try{
                const sort = (document.getElementById('cf-sort-filter')||{}).value || 'latency';
                const alive = document.getElementById('cf-only-alive')?.checked ? '&only_alive=true' : '';
                const res = await fetch(`${API}/cf/endpoints?limit=20000&sort=${sort}${alive}`);
                if(!res.ok) throw new Error(await res.text());
                const d = await res.json();
                cfData = d.endpoints||[];
                const by = d.by_isp||{};
                const cards = document.getElementById('cf-isp-cards');
                if (cards) cards.innerHTML =
                    ['telecom','mobile','unicom','all'].map(k=>`
                      <div class="stat-card"><div class="stat-value">${by[k]||0}</div>
                      <div class="stat-label">${ispLabel(k)}优选</div></div>`).join('');
                renderCfTable();
            }catch(e){ showToast('❌ CF优选加载失败: '+e.message,'error'); }
        }
        function cfLatencyBadge(la){
            if (la == null) return '<span class="text-muted">—</span>';
            const cls = la < 100 ? 'badge-success' : la < 200 ? 'badge-warning' : 'badge-danger';
            return `<span class="badge ${cls}">${la}ms</span>`;
        }
        async function pingCfEndpoints(btn){
            btn.disabled = true; btn.textContent = '⏳ 检测中…';
            try{
                const isp = (document.getElementById('cf-isp-filter')||{}).value || 'any';
                const res = await fetch(`${API}/cf/ping?isp=${isp}&limit=20000`, {method:'POST'});
                if(!res.ok) throw new Error(await res.text());
                showToast('⚡ 延迟检测已启动，约 30-60 秒后自动刷新','success');
                setTimeout(()=>{ loadCfEndpoints(); btn.disabled=false; btn.textContent='⚡ 测延迟'; }, 45000);
            }catch(e){
                showToast('❌ 启动失败: '+e.message,'error');
                btn.disabled=false; btn.textContent='⚡ 测延迟';
            }
        }
        function renderCfTable(){
            const tb = document.getElementById('cf-tbody'); if(!tb) return;
            const f = (document.getElementById('cf-isp-filter')||{}).value || 'any';
            const exp = document.getElementById('cf-export-btn');
            if (exp) exp.href = `${API}/cf/endpoints/export?isp=${f}&limit=20000`;
            const rows = cfData.filter(e=>f==='any'||e.isp===f);
            tb.innerHTML = rows.slice(0,1000).map(e=>{
                const t = e.last_seen_at ? new Date(e.last_seen_at*1000).toLocaleString() : '-';
                return `<tr><td>${cfLatencyBadge(e.latency_ms)}</td><td><code>${e.host}:${e.port}</code></td><td>${e.remark||''}</td><td>${ispLabel(e.isp)}</td><td class="text-muted">${t}</td></tr>`;
            }).join('') || '<tr><td colspan="5" class="text-muted">暂无数据——先到源列表页点「🔄 全量导入」</td></tr>';
        }
        function copyCfEndpoints(btn){
            const f = (document.getElementById('cf-isp-filter')||{}).value || 'any';
            const lines = cfData.filter(e=>f==='any'||e.isp===f).map(e=>`${e.host}:${e.port}#${e.remark||e.isp}`);
            navigator.clipboard.writeText(lines.join('\n')).then(()=>{
                btn.textContent='✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制当前',1500);
            }).catch(()=>showToast('复制失败，请用导出 txt','error'));
        }

        let sourcesTab = 'list';
        function switchSourcesTab(tab) {
            sourcesTab = tab;
            const page = document.getElementById('main-content');
            if (page) renderSources(page);
        }

        async function importAllSources(btn) {
            if (btn) { btn.disabled = true; btn.textContent = '⏳ 导入中…'; }
            try {
                const res = await fetch(`${API}/sources/import-all`, { method: 'POST' });
                if (!res.ok) throw new Error(await res.text());
                showToast('✅ 全量导入已启动，抓取解析约需 1-3 分钟，稍后点「刷新」查看各源节点数');
                setTimeout(loadSources, 30000);
            } catch(e) {
                showToast('❌ 启动失败: ' + e.message, 'error');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '🔄 全量导入'; }
            }
        }

        async function importSubUrl() {
            const name = document.getElementById('imp-sub-name').value.trim() || '手动订阅';
            const url = document.getElementById('imp-sub-url').value.trim();
            if (!url) return showToast('请输入订阅链接', 'error');
            try {
                const stype = /github\.com|raw\.githubusercontent\.com/.test(url) ? 'github' : 'http';
                const res = await fetch(`${API}/sources`, { method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ name, url, source_type: stype }) });
                if (res.ok) {
                    showToast('✅ 订阅已添加，下轮测速自动拉取节点');
                    document.getElementById('imp-sub-url').value = '';
                    loadSources();
                } else { const e = await res.json(); showToast('添加失败: ' + (e.detail||''), 'error'); }
            } catch(err) { showToast('网络错误', 'error'); }
        }

        async function importBatchNodes() {
            const content = document.getElementById('imp-batch').value.trim();
            const label = document.getElementById('imp-batch-label').value.trim() || '手动导入';
            const out = document.getElementById('imp-batch-result');
            if (!content) return showToast('请粘贴节点内容', 'error');
            out.textContent = '解析导入中...';
            try {
                const res = await fetch(`${API}/nodes/import`, { method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ content, label }) });
                const d = await res.json();
                if (res.ok) {
                    out.textContent = `✅ 成功 ${d.imported} 条${d.skipped?`，跳过重复 ${d.skipped}`:''}${d.errors.length?`，失败 ${d.errors.length}`:''}`;
                    showToast(`导入完成：${d.imported} 条节点已入库`);
                    document.getElementById('imp-batch').value = '';
                } else { out.textContent = '❌ ' + (d.detail||'导入失败'); }
            } catch(err) { out.textContent = '❌ 网络错误'; }
        }

        async function importSingleNode() {
            const g = id => document.getElementById(id).value.trim();
            const out = document.getElementById('imp-single-result');
            const type = g('imp-single-type');
            const secret = g('imp-single-secret') || null;
            // 按协议把 secret 映射到正确字段名
            let body = {
                type, server: g('imp-single-server'),
                port: parseInt(g('imp-single-port')) || 0,
                password: secret, uuid: secret,
                cipher: g('imp-single-cipher') || null, sni: g('imp-single-sni') || null,
                name: g('imp-single-name') || null
            };
            // 合并扩展参数 JSON（承载 wireguard 的 public_key/private_key 等）
            const extraRaw = g('imp-single-extra');
            if (extraRaw) {
                try { Object.assign(body, JSON.parse(extraRaw)); }
                catch(e) { return showToast('扩展参数 JSON 格式错误', 'error'); }
            }
            // 按类型裁剪无用字段，避免后端困惑
            const NEED_UUID = ['vmess','vless','tuic'];
            const NEED_PWD = ['ss','trojan','hysteria2','hy2','snell'];
            if (!NEED_UUID.includes(type)) delete body.uuid;
            if (!NEED_PWD.includes(type) && !['socks5','http','ssr','wireguard','hysteria'].includes(type)) delete body.password;
            if (type === 'wireguard') { delete body.password; delete body.uuid; }
            if (type === 'hysteria') { delete body.uuid; }
            if (!body.server || !body.port) return showToast('请填服务器和端口', 'error');
            try {
                const res = await fetch(`${API}/nodes/import/single`, { method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(body) });
                const d = await res.json();
                if (res.ok) { out.textContent = `✅ 已保存: ${d.name}`; showToast('节点已入库'); }
                else { out.textContent = '❌ ' + (d.detail||''); }
            } catch(err) { out.textContent = '❌ 网络错误'; }
        }

        async function loadSources() {
            try {
                const [sources, health, stats] = await Promise.all([
                    fetch(`${API}/sources`).then(r=>r.json()),
                    fetch(`${API}/sources/health`).then(r=>r.json()),
                    fetch(`${API}/nodes/stats`).then(r=>r.json())
                ]);
                const healthEl = document.getElementById('source-health');
                const tbodyEl = document.getElementById('sources-tbody');
                if (!healthEl || !tbodyEl) return;  // 页面已切换，放弃本次渲染（修复跨页 null 崩溃）
                const total = sources.length, healthy = health.filter(h => h.healthy).length;
                const nodeCount = (stats && stats.total) || 0;  // 真实节点总数（源未关联节点时 reduce 恒为 0）
                healthEl.innerHTML = `
                    <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">数据源总数</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#22c55e;">${healthy}</div><div class="stat-label">健康源</div></div>
                    <div class="stat-card"><div class="stat-value" style="color:#38bdf8;">${nodeCount}</div><div class="stat-label">累计节点</div></div>
                `;
                const tbody = tbodyEl;
                if (!sources.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty"><div class="empty-icon">📭</div>暂无数据源，点击"预置源"一键导入</td></tr>'; return; }
                tbody.innerHTML = sources.map(s => {
                    const h = health.find(h => h.id === s.id);
                    const isHealthy = h ? h.healthy : s.enabled;
                    return `<tr><td>${s.name}</td>
                        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;font-size:12px;">${s.url}</td>
                        <td><span class="badge badge-info">${s.source_type}</span></td>
                        <td>${s.node_count||0}</td>
                        <td><span class="badge ${isHealthy ? 'badge-success' : 'badge-danger'}">${isHealthy ? '健康' : '异常'}</span></td>
                        <td>
                            <button class="btn btn-sm ${s.enabled ? 'btn-secondary' : 'btn-primary'}" onclick="toggleSource(${s.id},${!s.enabled})">${s.enabled ? '禁用' : '启用'}</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSource(${s.id})">删除</button>
                        </td></tr>`;
                }).join('');
            } catch(e) { console.error(e); showToast('数据源加载失败: ' + (e.message||'网络错误'), 'error'); }
        }

        async function toggleSource(id, enabled) {
            await fetch(`${API}/sources/${id}/enable?enabled=${enabled}`, {method:'PUT'});
            showToast(enabled ? '已启用' : '已禁用');
            loadSources();
        }
        async function deleteSource(id) {
            if (!confirm('确定删除此数据源？')) return;
            await fetch(`${API}/sources/${id}`, {method:'DELETE'});
            showToast('已删除');
            loadSources();
        }

        // 手动添加数据源
        function showAddSourceModal() {
            document.getElementById('modal-overlay').classList.add('show');
            document.getElementById('modal-content').innerHTML = `
                <div class="modal-header"><h2 class="modal-title">➕ 添加数据源</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
                <div class="form-group"><label class="form-label">名称</label><input class="form-input" id="src-name" placeholder="如: GitHub源1"></div>
                <div class="form-group"><label class="form-label">订阅 URL</label><input class="form-input" id="src-url" placeholder="https://raw.githubusercontent.com/..."></div>
                <div class="form-group"><label class="form-label">类型</label><select class="form-input" id="src-type"><option value="github">GitHub</option><option value="telegram">Telegram</option><option value="other">其他</option></select></div>
                <div class="flex" style="justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doAddSource()">添加</button></div>
            `;
        }
        async function doAddSource() {
            const name = document.getElementById('src-name').value;
            const url = document.getElementById('src-url').value;
            const type = document.getElementById('src-type').value;
            if (!name || !url) { showToast('请填写完整信息', 'error'); return; }
            try {
                await fetch(`${API}/sources`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,url,source_type:type})});
                closeModal(); showToast('添加成功'); loadSources();
            } catch(e) { showToast('添加失败: '+e.message, 'error'); }
        }

        // 预置源导入
        function showPresetModal() {
            document.getElementById('modal-overlay').classList.add('show');
            document.getElementById('modal-content').innerHTML = '<div class="modal-header"><h2 class="modal-title">📦 预置免费节点源</h2><button class="modal-close" onclick="closeModal()">&times;</button></div><div class="preset-grid" id="preset-grid"><div class="empty">加载中...</div></div><div class="flex" style="justify-content:flex-end;margin-top:16px;"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doImportPresets()">导入选中</button></div>';
            loadPresets();
        }
        let selectedPresets = new Set();

        async function loadPresets() {
            try {
                const presets = await (await fetch(`${API}/sources/presets`)).json();
                const grid = document.getElementById('preset-grid');
                grid.innerHTML = presets.map((p,i) => `
                    <div class="preset-card ${p.already_added ? 'disabled' : ''}" data-idx="${i}" onclick="togglePreset(${i},${p.already_added})">
                        <div class="preset-name">${p.already_added ? '✅ ' : ''}${p.name}</div>
                        <div class="preset-url">${p.url}</div>
                        <div style="font-size:11px;color:#64748b;margin-top:4px;">${p.already_added ? '已存在' : '点击选中'}</div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }
        function togglePreset(idx, already) {
            if (already) return;
            const el = document.querySelector(`.preset-card[data-idx="${idx}"]`);
            el.classList.toggle('selected');
            if (selectedPresets.has(idx)) selectedPresets.delete(idx);
            else selectedPresets.add(idx);
        }
        async function doImportPresets() {
            if (selectedPresets.size === 0) { showToast('请先选择数据源', 'error'); return; }
            try {
                const res = await fetch(`${API}/sources/batch-import`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({source_ids:[...selectedPresets]})});
                const data = await res.json();
                showToast(`导入成功: ${data.imported.length} 个${data.skipped.length ? ', 跳过: '+data.skipped.length : ''}`);
                closeModal(); loadSources();
            } catch(e) { showToast('导入失败', 'error'); }
        }

        // 粘贴导入
        function showRawImportModal() {
            document.getElementById('modal-overlay').classList.add('show');
            document.getElementById('modal-content').innerHTML = `
                <div class="modal-header"><h2 class="modal-title">📋 粘贴导入</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
                <div class="form-group"><label class="form-label">名称</label><input class="form-input" id="raw-name" placeholder="如: 我的订阅"></div>
                <div class="form-group"><label class="form-label">Base64 订阅内容</label><textarea class="form-input" id="raw-content" placeholder="粘贴 Base64 编码的订阅内容..."></textarea></div>
                <div class="flex" style="justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doRawImport()">导入</button></div>
            `;
        }
        async function doRawImport() {
            const name = document.getElementById('raw-name').value;
            const content = document.getElementById('raw-content').value.trim();
            if (!name || !content) { showToast('请填写完整信息', 'error'); return; }
            try {
                const res = await fetch(`${API}/sources/raw-import`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, content, source_type:'raw'})});
                if (!res.ok) { const e = await res.json(); throw new Error(e.detail || '导入失败'); }
                closeModal(); showToast('导入成功'); loadSources();
            } catch(e) { showToast('导入失败: '+e.message, 'error'); }
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
            selectedPresets.clear();
        }

        // ===== 测速任务 =====
        function renderCheck(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">⚡ 测速任务</h1>
                    <button class="btn btn-primary" onclick="runCheck()">⚡ 立即测速</button>
                </div>
                <div class="table-container"><table><thead><tr>
                    <th>ID</th><th>类型</th><th>状态</th><th>开始时间</th><th>耗时</th><th>结果</th>
                </tr></thead><tbody id="check-tbody"></tbody></table></div>
            `;
            loadCheckHistory();
        }

        async function loadCheckHistory() {
            try {
                const jobs = await (await fetch(`${API}/check/history?limit=20`)).json();
                const tbody = document.getElementById('check-tbody');
                if (!tbody || currentPage !== 'check') return;  // 页面已切换，放弃本次渲染
                if (!jobs.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无任务记录</td></tr>'; return; }
                tbody.innerHTML = jobs.map(j => {
                    const st = j.started_at ? new Date(j.started_at*1000).toLocaleString() : '--';
                    const dur = j.started_at && j.finished_at ? Math.round(j.finished_at - j.started_at)+'s' : '--';
                    const badge = j.status === 'completed' ? 'badge-success' : j.status === 'failed' ? 'badge-danger' : 'badge-warning';
                    return `<tr><td>#${j.id}</td><td>${j.job_type}</td>
                        <td><span class="badge ${badge}">${j.status}</span></td>
                        <td>${st}</td><td>${dur}</td>
                        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;font-size:12px;">${j.error_message || j.result || '-'}</td></tr>`;
                }).join('');
            } catch(e) { console.error(e); showToast('测速记录加载失败: ' + (e.message||'网络错误'), 'error'); }
        }

        async function runCheck() {
            try {
                await fetch(`${API}/check/run`, {method:'POST'});
                showToast('测速任务已启动（后台执行）');
                setTimeout(() => { if (currentPage === 'check') loadCheckHistory(); }, 3000);
            } catch(e) { showToast('启动失败: '+e.message, 'error'); }
        }

        // ===== 订阅输出 =====
        function renderSubscribe(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">📥 订阅输出</h1>
                    <button class="btn btn-primary" onclick="genAggLink()">⚡ 一键生成聚合订阅</button>
                </div>

                <div class="chart-container" style="border:1px solid #22c55e55;">
                    <h3 style="margin-bottom:8px;">🌟 聚合订阅（手动导入 + 系统优选 全部节点）</h3>
                    <p class="text-muted" style="font-size:12px;margin-bottom:12px;">一个链接包含所有来源的可用节点，导入 Clash/V2Ray 客户端即可使用。每 6 小时随测速自动更新。</p>
                    <div class="flex" style="flex-wrap:wrap;gap:10px;align-items:center;">
                        <select class="form-input" style="width:150px;" id="agg-fmt" onchange="genAggLink()">
                            <option value="clash">Clash YAML</option>
                            <option value="clash-meta">Clash.Meta</option>
                            <option value="v2ray">V2Ray</option>
                            <option value="singbox">Sing-box</option>
                            <option value="base64">Base64</option>
                            <option value="txt">Txt 明文</option>
                            <option value="mixed">Mixed 混合链接</option>
                            <option value="surge">Surge</option>
                            <option value="loon">Loon</option>
                            <option value="qx">Quantumult X</option>
                        </select>
                        <button class="btn btn-secondary" onclick="copyAggLink()">📋 复制</button>
                        <span id="agg-count" class="text-muted" style="font-size:13px;"></span>
                    </div>
                    <div class="token-display mt-4" id="agg-link" style="display:none;word-break:break-all;"></div>
                    <div class="flex mt-4" style="align-items:flex-start;gap:24px;flex-wrap:wrap;">
                        <div>
                            <h4 style="margin-bottom:8px;">📱 扫码导入</h4>
                            <div id="agg-qr" style="background:#fff;padding:8px;border-radius:8px;width:196px;height:196px;display:flex;align-items:center;justify-content:center;"><span class="text-muted">生成后显示</span></div>
                        </div>
                        <div style="flex:1;min-width:220px;">
                            <h4 style="margin-bottom:8px;">✂️ 分来源订阅</h4>
                            <div class="flex" style="gap:8px;flex-wrap:wrap;">
                                <button class="btn btn-secondary" onclick="copyText('${location.origin}/api/nodes/subscribe?fmt=clash&src=manual')">🛠 仅手动导入</button>
                                <button class="btn btn-secondary" onclick="copyText('${location.origin}/api/nodes/subscribe?fmt=clash&src=auto')">🤖 仅系统优选</button>
                            </div>
                            <p class="text-muted" style="font-size:11px;margin-top:8px;">把 fmt=clash 换成 v2ray/singbox/base64/txt 可切换格式</p>
                        </div>
                    </div>
                </div>

                <div class="chart-container">
                    <h3 style="margin-bottom:16px;">⚙️ 自定义订阅生成</h3>
                    <div class="form-group"><label class="form-label">格式</label>
                        <select class="form-input" id="sub-fmt" style="max-width:200px;">
                            <option value="clash">Clash YAML</option>
                            <option value="clash-meta">Clash.Meta</option>
                            <option value="v2ray">V2Ray</option>
                            <option value="singbox">Sing-box</option>
                            <option value="base64">Base64</option>
                            <option value="txt">Txt 明文</option>
                            <option value="mixed">Mixed 混合链接</option>
                            <option value="surge">Surge</option>
                            <option value="loon">Loon</option>
                            <option value="qx">Quantumult X</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">数量限制</label>
                        <input class="form-input" id="sub-limit" type="number" value="1000" min="1" max="20000" style="max-width:200px;">
                    </div>
                    <div class="form-group"><label class="form-label">最低评分</label>
                        <input class="form-input" id="sub-minscore" type="number" value="0" min="0" max="100" style="max-width:200px;">
                    </div>
                    <div class="flex">
                        <button class="btn btn-primary" onclick="genSubLink()">🔗 生成链接</button>
                        <button class="btn btn-secondary" onclick="copySubLink()">📋 复制链接</button>
                        <a class="btn btn-secondary" id="sub-open" href="#" target="_blank" style="display:none;">↗ 打开</a>
                    </div>
                    <div class="token-display mt-4" id="sub-link" style="display:none;"></div>
                    <div class="flex mt-4" style="align-items:flex-start;gap:24px;">
                        <div>
                            <h4 style="margin-bottom:8px;">📱 扫码导入</h4>
                            <div id="sub-qr" style="background:#fff;padding:8px;border-radius:8px;width:196px;height:196px;display:flex;align-items:center;justify-content:center;"><span class="text-muted">生成链接后显示二维码</span></div>
                        </div>
                        <div style="flex:1;min-width:240px;">
                            <h4 style="margin-bottom:8px;">🔗 Token 订阅短链</h4>
                            <p class="text-muted" style="font-size:12px;line-height:1.8;">
                                创建 Token 后可使用短链格式：<br>
                                <code style="color:#38bdf8;">/sub/&lt;token&gt;/clash</code><br>
                                <code style="color:#38bdf8;">/sub/&lt;token&gt;/v2ray</code> ·
                                <code style="color:#38bdf8;">/singbox</code> ·
                                <code style="color:#38bdf8;">/base64</code> ·
                                <code style="color:#38bdf8;">/txt</code> ·
                                <code style="color:#38bdf8;">/surge</code> ·
                                <code style="color:#38bdf8;">/loon</code> ·
                                <code style="color:#38bdf8;">/qx</code><br>
                                筛选参数：<code>?min_speed=10&max_latency=300&limit=100</code>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        let lastSubLink = '';
        async function genAggLink() {
            const fmt = document.getElementById('agg-fmt').value;
            const link = `${location.origin}/api/nodes/subscribe?fmt=${fmt}&limit=5000`;
            const el = document.getElementById('agg-link');
            el.textContent = link; el.style.display = 'block';
            window._aggLink = link;
            renderSubQRTo('agg-qr', link);
            try {
                const stats = await (await fetch(`${API}/nodes/stats`)).json();
                document.getElementById('agg-count').textContent = `当前聚合 ${stats.active ?? stats.active_nodes ?? '?'} 个可用节点`;
            } catch(e) {}
        }
        function copyAggLink() {
            const link = window._aggLink || `${location.origin}/api/nodes/subscribe?fmt=clash&limit=5000`;
            copyText(link);
        }
        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板')).catch(() => fallbackCopy(text));
            } else fallbackCopy(text);
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast('✅ 已复制'); } catch(e) { showToast('复制失败，请手动选择', 'error'); }
            document.body.removeChild(ta);
        }
        function renderSubQRTo(containerId, text) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            try {
                new QRCode(container, { text, width: 180, height: 180, colorDark: '#0f172a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
            } catch(e) { container.innerHTML = '<span class="text-muted">QR 生成失败</span>'; }
        }
        function genSubLink() {
            const fmt = document.getElementById('sub-fmt').value;
            const limit = document.getElementById('sub-limit').value || 100;
            const minScore = document.getElementById('sub-minscore').value || 0;
            lastSubLink = `${location.origin}/api/nodes/subscribe?fmt=${fmt}&limit=${limit}&min_score=${minScore}`;
            const el = document.getElementById('sub-link');
            el.textContent = lastSubLink;
            el.style.display = 'block';
            document.getElementById('sub-open').href = lastSubLink;
            document.getElementById('sub-open').style.display = 'inline-flex';
            renderSubQR(lastSubLink);
        }
        function renderSubQR(text) {
            const container = document.getElementById('sub-qr');
            if (!container) return;
            container.innerHTML = '';
            try {
                new QRCode(container, { text, width: 180, height: 180, colorDark: '#0f172a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
            } catch(e) { container.innerHTML = '<span class="text-muted">QR 生成失败</span>'; }
        }
        function copySubLink() {
            if (!lastSubLink) { showToast('请先生成链接', 'error'); return; }
            navigator.clipboard.writeText(lastSubLink);
            showToast('已复制到剪贴板');
        }

        // ===== Token 管理 =====
        function renderTokens(main) {
            main.innerHTML = `
                <div class="page-header"><h1 class="page-title">🔑 令牌管理</h1>
                    <button class="btn btn-primary" onclick="showCreateTokenModal()">➕ 创建 Token</button>
                </div>
                <div class="table-container"><table><thead><tr>
                    <th>ID</th><th>名称</th><th>Token 预览</th><th>权限</th><th>状态</th><th>最后使用</th><th>操作</th>
                </tr></thead><tbody id="tokens-tbody"></tbody></table></div>
            `;
            loadTokens();
        }

        async function loadTokens() {
            try {
                const tokens = await (await fetch(`${API}/tokens`)).json();
                const tbody = document.getElementById('tokens-tbody');
                if (!tbody || currentPage !== 'tokens') return;  // 页面已切换，放弃本次渲染
                if (!tokens.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty"><div class="empty-icon">🔑</div>暂无 Token，点击"创建 Token"生成订阅访问凭证</td></tr>'; return; }
                tbody.innerHTML = tokens.map(t => `
                    <tr><td>#${t.id}</td><td>${t.name}</td>
                        <td style="font-family:monospace;font-size:12px;">${t.token_preview || t.token.slice(0,8)+'...'}</td>
                        <td><span class="badge badge-info">${t.permissions}</span></td>
                        <td><span class="badge ${t.is_active ? 'badge-success' : 'badge-danger'}">${t.is_active ? '启用' : '禁用'}</span></td>
                        <td>${t.last_used_at ? new Date(t.last_used_at*1000).toLocaleString() : '从未'}</td>
                        <td>
                            <button class="btn btn-sm ${t.is_active ? 'btn-secondary' : 'btn-primary'}" onclick="toggleToken(${t.id},${!t.is_active})">${t.is_active ? '禁用' : '启用'}</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteToken(${t.id})">删除</button>
                        </td></tr>
                `).join('');
            } catch(e) { console.error(e); }
        }

        function showCreateTokenModal() {
            document.getElementById('modal-overlay').classList.add('show');
            document.getElementById('modal-content').innerHTML = `
                <div class="modal-header"><h2 class="modal-title">➕ 创建 Token</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
                <div class="form-group"><label class="form-label">名称</label><input class="form-input" id="tk-name" placeholder="如: 我的手机订阅"></div>
                <div class="form-group"><label class="form-label">权限</label>
                    <select class="form-input" id="tk-perm"><option value="read">read（只读订阅）</option><option value="write">read-write</option></select>
                </div>
                <div class="flex" style="justify-content:flex-end;"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="doCreateToken()">创建</button></div>
            `;
        }

        let newTokenValue = '';
        async function doCreateToken() {
            const name = document.getElementById('tk-name').value || 'default';
            const permissions = document.getElementById('tk-perm').value;
            try {
                const res = await fetch(`${API}/tokens`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, permissions})});
                const data = await res.json();
                newTokenValue = data.token;
                document.getElementById('modal-content').innerHTML = `
                    <div class="modal-header"><h2 class="modal-title">✅ Token 创建成功</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
                    <p class="text-muted mb-4">请立即保存此 Token（仅显示一次）：</p>
                    <div class="token-display">${data.token}</div>
                    <div class="flex mt-4">
                        <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${data.token}');showToast('已复制')">📋 复制</button>
                        <button class="btn btn-secondary" onclick="closeModal();loadTokens()">完成</button>
                    </div>
                `;
            } catch(e) { showToast('创建失败', 'error'); }
        }

        async function toggleToken(id, active) {
            await fetch(`${API}/tokens/${id}/toggle?is_active=${active}`, {method:'PUT'});
            showToast(active ? '已启用' : '已禁用');
            loadTokens();
        }
        async function deleteToken(id) {
            if (!confirm('确定删除此 Token？使用它的订阅链接将立即失效')) return;
            await fetch(`${API}/tokens/${id}`, {method:'DELETE'});
            showToast('已删除');
            loadTokens();
        }

        // ===== 初始化 =====
        renderPage('dashboard');

        // 世界地图 GeoJSON 由 ensureWorldMap() 按需从本地 /vendor/world.json 加载（不依赖外网 CDN）

        // 侧边栏状态刷新：立即执行一次，之后每 30 秒刷新
        async function refreshSidebarStats() {
            try {
                const stats = await (await fetch(`${API}/nodes/stats`)).json();
                document.getElementById('total-nodes').textContent = `总节点: ${stats.total}`;
            } catch(e) {}
        }
        refreshSidebarStats();
        setInterval(refreshSidebarStats, 30000);
    </script>
</body>
</html>

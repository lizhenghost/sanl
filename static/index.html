<script>
// ===== 全局任务进度轮询 =====
let _gtShown = new Set();   // 已通知过的完成任务 id
let _gtTimer = null;
async function pollGlobalTasks() {
    let hasActive = false;
    try {
        const d = await (await fetch(`${API}/tasks`)).json();
        const box = document.getElementById('global-tasks');
        const act = d.active || [];
        if (!act.length) {
            // 无活动任务：展示 5 秒内刚完成的，随后隐藏
            const recent = (d.recent || []).filter(t => t.elapsed < 8 && !_gtShown.has(t.id));
            if (!recent.length) { box.innerHTML = ''; return; }
            box.innerHTML = recent.map(t => `
                <div style="pointer-events:auto;margin:6px auto;max-width:520px;background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:8px 14px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;">
                    ✅ ${t.name} 完成 · 耗时 ${t.elapsed}s
                </div>`).join('');
            recent.forEach(t => _gtShown.add(t.id));
            setTimeout(() => { box.innerHTML = ''; }, 5000);
            return;
        }
        box.innerHTML = act.map(t => {
            const pct = t.pct >= 0 ? t.pct : null;
            const bar = pct != null
                ? `<div style="height:7px;background:var(--bd,#e2e8f0);border-radius:4px;overflow:hidden;margin-top:6px;">
                     <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:4px;transition:width .6s ease;"></div>
                   </div><div style="text-align:right;font-size:11px;color:var(--mut,#64748b);margin-top:2px;">${t.done}/${t.total} · ${pct}% · ${t.elapsed}s</div>`
                : `<div style="margin-top:6px;height:7px;border-radius:4px;background:repeating-linear-gradient(90deg,#2563eb 0 14px,#93c5fd 14px 28px);background-size:56px 100%;animation:gtslide 1.1s linear infinite;"></div>
                   <div style="text-align:right;font-size:11px;color:var(--mut,#64748b);margin-top:2px;">${t.detail || '进行中'} · ${t.elapsed}s</div>`;
            return `<div style="pointer-events:auto;margin:6px auto;max-width:520px;background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:13px;font-weight:600;">
                      ${t.name}${t.detail && pct != null ? ` <span style="font-weight:400;color:var(--mut,#64748b);font-size:12px;">· ${t.detail}</span>` : ''}${bar}
                    </div>`;
        }).join('');
    } catch(e) {}
    finally {
        clearTimeout(_gtTimer);
        _gtTimer = setTimeout(pollGlobalTasks, hasActive ? 2500 : 10000);
    }
}
if (!document.getElementById('gtslide-style')) {
    const st = document.createElement('style'); st.id = 'gtslide-style';
    st.textContent = '@keyframes gtslide{from{background-position:0 0}to{background-position:56px 0}}';
    document.head.appendChild(st);
}
pollGlobalTasks();

// E4：后端缓存命中率浮标（验证「多命中缓存」效果）
(function () {
    const b = document.createElement('button');
    b.textContent = '⚡缓存';
    b.style.cssText = 'position:fixed;right:14px;bottom:70px;z-index:999;padding:8px 12px;border-radius:20px;border:1px solid var(--bd,#e2e8f0);background:var(--card,#fff);color:var(--text,#0f172a);font-size:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);';
    b.onclick = async () => {
        try {
            const d = await (await fetch(`${API}/cache/status`)).json();
            const hit = d.hit || 0, miss = d.miss || 0;
            const rate = (hit + miss) ? Math.round(hit / (hit + miss) * 100) : 0;
            const m = document.createElement('div'); m.className = 'modal'; m.style.display = 'flex';
            m.innerHTML = `<div class="modal-content" style="max-width:420px;">
                <div class="modal-header"><h2 class="modal-title">⚡ 后端缓存命中率</h2>
                    <button class="modal-close" style="background:none;border:0;font-size:24px;color:var(--text-muted,#64748b);cursor:pointer;">&times;</button></div>
                <p style="font-size:13px;color:var(--text-muted,#64748b);">用于验证「多命中缓存、不命中缓存」目标：读多写少接口已加 3~5s TTL，缓解高频轮询打 SQLite 的成本。</p>
                <div style="margin:16px 0;"><b>命中率</b> <span style="font-size:24px;font-weight:700;color:#2563eb;">${rate}%</span></div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;">
                    <div style="background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:12px;"><div style="font-size:22px;font-weight:700;">${hit}</div><div style="font-size:11px;color:var(--text-muted,#64748b);">命中</div></div>
                    <div style="background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:12px;"><div style="font-size:22px;font-weight:700;">${miss}</div><div style="font-size:11px;color:var(--text-muted,#64748b);">未命中</div></div>
                    <div style="background:var(--card,#fff);border:1px solid var(--bd,#e2e8f0);border-radius:10px;padding:12px;"><div style="font-size:22px;font-weight:700;">${d.size || 0}</div><div style="font-size:11px;color:var(--text-muted,#64748b);">缓存条目</div></div>
                </div>
                <div style="margin-top:16px;text-align:right;"><button class="btn btn-secondary" onclick="this.closest('.modal').remove()">关闭</button></div></div>`;
            m.onclick = e => { if (e.target === m) m.remove(); };
            m.querySelector('.modal-close').onclick = () => m.remove();
            document.body.appendChild(m);
        } catch (e) { alert('缓存状态获取失败: ' + e.message); }
    };
    document.body.appendChild(b);
})();

let _cwScript = '', _cwConfigLink = '';

async function generateWorker() {
    const nodeCount = parseInt(document.getElementById('cw-nodes').value) || 20;
    const userId = document.getElementById('cw-uuid').value.trim();
    const proxyIp = document.getElementById('cw-proxy-ip').value.trim();
    const maxCh = parseInt(document.getElementById('cw-channels').value) || 100;
    try {
        const r = await fetch('/api/edgetunnel/generate', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({node_count: nodeCount, user_id: userId || null,
                                   proxy_ip: proxyIp, max_channels: maxCh, include_nodes: true}),
        });
        const d = await r.json();
        if (!d.ok) { showToast('生成失败: ' + (d.error || 'unknown'), 'error'); return; }
        _cwScript = d.script; _cwConfigLink = d.config_link;
        document.getElementById('cw-script').value = d.script;
        document.getElementById('cw-config-link').value = d.config_link;
        document.getElementById('cw-result').style.display = 'block';
        document.getElementById('cw-config').style.display = 'block';
        if (d.nodes && d.nodes.length > 0) {
            document.getElementById('cw-nodes-table').innerHTML = '<table style="width:100%;font-size:13px;"><thead><tr><th style="text-align:left;">名称</th><th>协议</th><th>服务器</th><th>延迟</th><th>国家</th></tr></thead><tbody>'
                + d.nodes.map(n => '<tr><td>' + escHtml(n.name || '') + '</td><td>' + escHtml(n.type || '')
                + '</td><td style="font-family:monospace;font-size:11px;">' + escHtml(n.server || '') + ':' + n.port + '</td>'
                + '<td>' + (n.latency ? n.latency + 'ms' : '-') + '</td><td>' + escHtml(n.country || '') + '</td></tr>').join('')
                + '</tbody></table>';
            document.getElementById('cw-nodes-list').style.display = 'block';
        } else { document.getElementById('cw-nodes-list').style.display = 'none'; }
        showToast('✅ Worker 脚本已生成（' + d.node_count + ' 个参考节点）');
    } catch (e) { showToast('请求失败: ' + e.message, 'error'); }
}

async function loadExample() {
    try {
        const r = await fetch('/api/edgetunnel/config-example');
        const d = await r.json();
        _cwScript = d.script; _cwConfigLink = d.config_link;
        document.getElementById('cw-script').value = d.script;
        document.getElementById('cw-config-link').value = d.config_link;
        document.getElementById('cw-result').style.display = 'block';
        document.getElementById('cw-config').style.display = 'block';
        document.getElementById('cw-nodes-list').style.display = 'none';
        showToast('✅ 示例已加载');
    } catch (e) { showToast('加载失败: ' + e.message, 'error'); }
}

function copyWorkerScript() {
    const el = document.getElementById('cw-script'); el.select();
    navigator.clipboard.writeText(el.value).then(() => showToast('脚本已复制')).catch(() => showToast('复制失败', 'error'));
}
function downloadWorkerScript() {
    const blob = new Blob([_cwScript], {type: 'text/javascript'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'worker.js'; a.click(); URL.revokeObjectURL(a.href);
    showToast('✅ 已下载 worker.js');
}
function copyConfigLink() {
    const el = document.getElementById('cw-config-link'); el.select();
    navigator.clipboard.writeText(el.value).then(() => showToast('链接已复制')).catch(() => showToast('复制失败', 'error'));
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
